<style>
:root{
  --floor:#D7DAD4; --panel:#F3F4F0; --raise:#FFF; --ink:#1E2225;
  --soft:rgba(30,34,37,.62); --faint:rgba(30,34,37,.40);
  --line:rgba(30,34,37,.16); --line-2:rgba(30,34,37,.32); --wash:rgba(30,34,37,.06);
  --accent:#2C7A4E; --on-accent:#fff;
  --sans:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Barlow',-apple-system,'Arial Narrow',sans-serif;
}
html[data-theme="dark"]{
  --floor:#15181A; --panel:#1E2225; --raise:#272C2F; --ink:#E8EAE5;
  --soft:rgba(232,234,229,.66); --faint:rgba(232,234,229,.42);
  --line:rgba(232,234,229,.14); --line-2:rgba(232,234,229,.30); --wash:rgba(232,234,229,.08);
}
html[data-accent="iron"]{--accent:#2C7A4E}
html[data-accent="clay"]{--accent:#B7242B}
html[data-accent="ocean"]{--accent:#1C4E86}
html[data-accent="amber"]{--accent:#A97400}
html[data-accent="plum"]{--accent:#6B3FA0}
html[data-accent="slate"]{--accent:#3E4A52}
html[data-theme="dark"][data-accent="iron"]{--accent:#4FAE7C;--on-accent:#10201A}
html[data-theme="dark"][data-accent="clay"]{--accent:#E0565C;--on-accent:#2A0E10}
html[data-theme="dark"][data-accent="ocean"]{--accent:#5B95D6;--on-accent:#0B1B2C}
html[data-theme="dark"][data-accent="amber"]{--accent:#D8A93A;--on-accent:#241B05}
html[data-theme="dark"][data-accent="plum"]{--accent:#A branch}
html[data-theme="dark"][data-accent="plum"]{--accent:#A985DC;--on-accent:#1D1030}
html[data-theme="dark"][data-accent="slate"]{--accent:#93A3AD;--on-accent:#14191C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--floor);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 34px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:21px;margin:22px 0 10px}
h2:first-child{margin-top:0}
h3{font-size:16px;margin-bottom:6px}
p{margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:left}
input,select,textarea{font:inherit;color:inherit;background:var(--raise);border:1px solid var(--line-2);border-radius:6px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--soft)} .small{font-size:14px} .tiny{font-size:13px}
header{position:sticky;top:0;z-index:30;background:var(--floor);max-width:560px;margin:0 auto;
  padding:12px 14px 0;border-bottom:1px solid var(--line)}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.masthead h1{font-family:var(--cond);font-size:26px;font-weight:700;letter-spacing:.02em}
.icon{border:1px solid var(--line-2);border-radius:6px;padding:11px 14px;min-height:44px;font-size:14px;
  background:var(--panel);color:var(--soft)}
.store{font-size:12px;color:var(--faint);margin-top:2px}
.store.warn{color:#B7242B}
.hero{border:1px solid var(--line);border-left:6px solid var(--c,var(--accent));background:var(--panel);
  border-radius:6px;padding:16px;margin-bottom:12px}
.hero .day{font-size:14px;color:var(--soft)}
.hero .big{font-family:var(--cond);font-size:34px;font-weight:700;line-height:1.06;margin:3px 0}
.hero .why{font-size:15px;color:var(--soft);margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px;margin-bottom:12px}
.card.pick{border-left:6px solid var(--c,var(--line-2))}
.nm{font-size:18px;font-weight:600}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--on-accent)}
.cta{display:block;width:100%;margin-top:12px;padding:16px;border-radius:6px;background:var(--accent);
  color:var(--on-accent);font-size:18px;font-weight:600;text-align:center}
.cta.ghost{background:none;color:var(--ink);border:1px solid var(--line-2)}
.cta.dark{background:var(--ink);color:var(--floor)}
.cta:active{opacity:.85}
.mini{font-size:14px;padding:11px 14px;min-height:44px;border:1px solid var(--line-2);border-radius:6px;
  background:var(--panel);display:inline-flex;align-items:center}
.mini.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mini.danger{color:#B7242B;border-color:#B7242B}
html[data-theme="dark"] .mini.danger{color:#E0565C;border-color:#E0565C}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;color:var(--soft);margin-bottom:5px;line-height:1.3}
.field input,.field select,.field textarea{width:100%;padding:12px;min-height:48px;font-size:17px;
  font-family:var(--sans);font-weight:400;text-align:left}
.field textarea{min-height:100px;resize:vertical}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px}
.step{display:flex;gap:8px}
.step button{flex:0 0 56px;min-height:52px;border:1px solid var(--line-2);border-radius:6px;background:var(--raise);
  font-family:var(--cond);font-size:26px;font-weight:700;text-align:center;line-height:1}
.step .val{flex:1;border:1px solid var(--line-2);border-radius:6px;background:var(--raise);
  text-align:center;padding:10px 4px;font-family:var(--cond);font-size:28px;font-weight:700;
  font-variant-numeric:tabular-nums}
.step .val small{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--soft)}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.figs figure{margin:0}
.figs .fig{background:var(--raise);border:1px solid var(--line);border-radius:6px;
  color:var(--ink);aspect-ratio:1/1}
.figs .fig svg{display:block;width:100%;height:100%}
.figs figcaption{font-size:12px;color:var(--soft);text-align:center;margin-top:4px}
.cue{font-size:15px;color:var(--soft);margin-top:8px;padding-left:12px;border-left:3px solid var(--line-2)}
.next{display:inline-block;font-size:14px;padding:7px 11px;border-radius:6px;background:var(--wash);color:var(--soft)}
.next b{font-family:var(--cond);font-size:18px;font-weight:700;color:var(--ink)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin-top:10px}
.setbtn{border:1px solid var(--line-2);border-radius:6px;background:var(--raise);padding:14px 4px;min-height:56px;
  text-align:center;font-size:14px;color:var(--soft)}
.setbtn.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.setbtn b{display:block;font-family:var(--cond);font-size:19px}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);
  font-size:16px;width:100%}
.check:last-child{border-bottom:none}
.box{width:28px;height:28px;flex:0 0 28px;border:1px solid var(--line-2);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:transparent}
.check.done .box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.check.done .t{color:var(--soft);text-decoration:line-through}
.check .r{margin-left:auto;color:var(--soft);font-size:14px;text-align:right}
.timer{background:var(--ink);color:var(--floor);padding:12px 14px;margin-bottom:14px;
  display:flex;align-items:center;gap:12px;border-radius:6px}
.timer .t{font-family:var(--cond);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.timer button{margin-left:auto;color:var(--floor);border:1px solid rgba(255,255,255,.4);
  border-radius:6px;padding:8px 13px;font-size:14px}
.flowbar{display:flex;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.flowbar button{flex:1;padding:15px;border-radius:6px;text-align:center;font-weight:600;font-size:17px}
.flowbar .prev{border:1px solid var(--line-2);flex:0 0 32%}
.flowbar .next{background:var(--accent);color:var(--on-accent)}
.withrail{display:flex;gap:10px;align-items:flex-start}
.railmain{flex:1;min-width:0}
.rail{position:sticky;top:92px;flex:0 0 36px;display:flex;flex-direction:column;gap:6px}
.rail button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel);
  font-family:var(--cond);font-weight:700;font-size:15px;text-align:center;color:var(--soft);padding:0}
.rail button.done{background:var(--wash);color:var(--ink)}
.rail button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rail .lbl{font-size:10px;color:var(--faint);text-align:center;line-height:1.1}
ul.plain{margin:0;padding:0;list-style:none}
ul.plain li{display:flex;justify-content:space-between;gap:14px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:16px}
ul.plain li:last-child{border-bottom:none}
ul.plain li .r{color:var(--soft);text-align:right;font-size:14px}
ol.steps{margin:0;padding-left:22px;font-size:16px}
ol.steps li{padding:4px 0}
.week{width:100%;border-collapse:collapse;font-size:15px}
.week td{padding:9px 4px;border-bottom:1px solid var(--line)}
.week td:first-child{color:var(--soft);width:36%}
.week td:last-child{text-align:right}
.tag{display:inline-block;min-width:26px;text-align:center;font-family:var(--cond);font-weight:700;
  font-size:17px;padding:2px 7px;border-radius:4px;color:#fff}
.opt{border:1px solid var(--line-2);border-radius:6px;background:var(--panel);padding:14px;
  margin-bottom:9px;width:100%;display:block}
.opt[aria-pressed="true"]{border-color:var(--accent);border-width:2px;padding:13px}
.opt .t{font-size:17px;font-weight:600;display:block}
.opt .d{font-size:14px;color:var(--soft);margin-top:3px;display:block}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.excard{border:1px solid var(--line-2);border-radius:6px;background:var(--panel);padding:10px;text-align:left}
.excard .t{font-size:15px;font-weight:600;line-height:1.2}
.excard .d{font-size:12px;color:var(--soft)}
.excard .figs{margin:6px 0 0;gap:5px}
.excard .figs figcaption{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{padding:11px 15px;min-height:44px;border:1px solid var(--line-2);border-radius:99px;
  background:var(--panel);font-size:14px;display:inline-flex;align-items:center}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hist{border-bottom:1px solid var(--line);padding:12px 0;width:100%;display:block}
.hist:last-child{border-bottom:none}
.empty{color:var(--soft);font-size:16px;padding:18px 0}
.chart{display:block;width:100%;height:150px;color:var(--accent)}
.sheetbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
nav{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px}
nav button{padding:12px 2px;min-height:48px;font-size:13px;color:var(--soft);text-align:center;font-weight:500}
nav button[aria-current="page"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--accent)}
#toast{display:none;background:var(--ink);color:var(--floor);padding:11px 14px;border-radius:6px;
  font-size:15px;margin:8px 0 0}
#toast.show{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

     fill="currentColor" opacity=".14"/>`;

const TIME={setup:15,perRep:3,transition:60,warmupSet:60};

function repSeconds(reps){
  const r=String(reps).replace('+','').trim();
  if(/s$/.test(r)) return (parseInt(r)||30);
  const n=parseInt(r)||10;
  return n*TIME.perRep;
}
function exMinutes(sets,reps,rest,isCore){
  const per=TIME.setup+repSeconds(reps);
  let secs=sets*per+Math.max(0,sets-1)*rest+TIME.transition;
  if(isCore) secs+=2*TIME.warmupSet;      // the two ramp sets
  return secs/60;
}
function liftMinutes(items){
  const groups={}; let total=0;
  items.forEach(i=>{
    if(i.group){ (groups[i.group]=groups[i.group]||[]).push(i); return; }
    total+=exMinutes(i.sets,i.reps,i.rest,i.tier==='core');
  });
  /* a superset pays its rest once per round, not once per exercise */
  Object.values(groups).forEach(gr=>{
    const rounds=Math.max(...gr.map(x=>x.sets));
    const work=gr.reduce((a,x)=>a+x.sets*(TIME.setup+repSeconds(x.reps)),0);
    const rest=Math.max(...gr.map(x=>x.rest));
    total+=(work+Math.max(0,rounds-1)*rest+TIME.transition)/60;
  });
  return total;
}

}
function kitOrder(kit,level){
  if(kit==='any') return level==='new'
    ? ['machine','dumbbell','cable','bodyweight','barbell']
    : ['barbell','dumbbell','machine','cable','bodyweight'];
  return KIT[kit]||KIT.any;
}
function chooseSplit(days,level){
  const S=(code,name,plan,patterns)=>({code,name,plan,patterns});
  if(days<=2) return [S('A','Full body A','full',['squat','hpush','hpull','hinge']),
                      S('B','Full body B','full',['hinge','vpull','vpush','squat'])];
  if(days===3){
    if(level==='experienced') return [S('P','Push','push',['hpush','vpush']),
                                      S('L','Pull','pull',['vpull','hpull']),
                                      S('G','Legs','legs',['squat','hinge'])];
    return [S('A','Full body A','full',['squat','hpull','hpush','hinge']),
            S('B','Full body B','full',['hinge','vpush','vpull','squat']),
            S('C','Full body C','full',['squat','vpull','hpush','hinge'])];
  }
  if(days===4) return [S('U1','Upper body A','upper',['hpush','vpull','vpush','hpull']),
                       S('L1','Lower body A','lower',['squat','hinge']),
                       S('U2','Upper body B','upper',['vpush','hpull','hpush','vpull']),
                       S('L2','Lower body B','lower',['hinge','squat'])];
  if(days===5) return [S('U1','Upper body A','upper',['hpush','vpull','vpush','hpull']),
                       S('L1','Lower body A','lower',['squat','hinge']),
                       S('P','Push','push',['hpush','vpush']),
                       S('L2','Pull','pull',['vpull','hpull']),
                       S('G','Legs','legs',['hinge','squat'])];
  return [S('P1','Push A','push',['hpush','vpush']),S('L1','Pull A','pull',['vpull','hpull']),
          S('G1','Legs A','legs',['squat','hinge']),S('P2','Push B','push',['vpush','hpush']),
          S('L2','Pull B','pull',['hpull','vpull']),S('G2','Legs B','legs',['hinge','squat'])];
}
function spreadDays(avail,n){
  const idx=(avail&&avail.length?avail:WEEK).map(d=>WEEK.indexOf(d)).filter(i=>i>=0).sort((a,b)=>a-b);
  if(idx.length<=n) return idx.map(i=>WEEK[i]);
  const combos=(arr,k)=>k===0?[[]]:arr.flatMap((v,i)=>combos(arr.slice(i+1),k-1).map(c=>[v,...c]));
  let best=idx.slice(0,n), score=-1;
  combos(idx,n).forEach(c=>{
    const s=c.slice().sort((a,b)=>a-b);
    let min=99;
    for(let i=0;i<s.length;i++) min=Math.min(min, i===s.length-1 ? s[0]+7-s[i] : s[i+1]-s[i]);
    if(min>score){ score=min; best=s; }
  });
  return best.map(i=>WEEK[i]);
}
function slotCap(level,mins){
  const byLevel={new:5,returning:6,experienced:8}[level]||6;
  const byTime=mins<=30?4:mins<=45?6:mins<=60?7:9;
  return Math.min(byLevel,byTime);
}
function volumeTargets(level,focusMuscles){
  const base={new:[6,12],returning:[8,14],experienced:[10,18]}[level]||[8,14];
  const t={};
  BIG.forEach(m=>{
    const f=focusMuscles.includes(m);
    t[m]=[f?base[0]+2:base[0], f?base[1]+4:base[1]];
  });
  t.back=[base[0],base[1]+6];              // several muscles, handles more work
  t.calves=[Math.max(2,base[0]-4),base[1]];
  t.core=[Math.max(2,base[0]-4),base[1]+2];   // the compounds already work the trunk
  t.biceps=[Math.max(3,base[0]-3),base[1]];
  t.triceps=[Math.max(3,base[0]-3),base[1]];
  if(focusMuscles.includes('core')) t.core=[base[0],base[1]+6];
  if(focusMuscles.includes('back')) t.back=[base[0]+2,base[1]+10];
  if(focusMuscles.includes('biceps')){ t.biceps=[base[0],base[1]+4]; t.triceps=[base[0],base[1]+4]; }
  return t;
}
function weeklyVolume(sessions){
  const v={}; BIG.forEach(m=>v[m]=0);
  sessions.forEach(s=>s.items.forEach(it=>{
    it.lib.muscles.forEach((m,i)=>{ if(v[m]!==undefined) v[m]+=it.sets*(i===0?1:0.5); });
  }));
  Object.keys(v).forEach(k=>v[k]=Math.round(v[k]*10)/10);
  return v;
}
function generateRoutine(a, shuffleSeed){
  const lib=SEED.library, level=a.level||'new', goal=GOALS[a.goal]||GOALS.health;
  const order=kitOrder(a.kit||'any',level);
  const focus=(a.focus||[]).filter(f=>f!=='none').flatMap(f=>FOCUS[f]||[]);
  const days=a.days||3;
  const doorToDoor=a.time||60;
  const dflt = doorToDoor<=35?{warmup:6,stretch:5} : doorToDoor<=45?{warmup:8,stretch:8} : {warmup:9,stretch:10};
  const timing={warmup:a.warmup??dflt.warmup, stretch:a.stretch??dflt.stretch,
                cardio:CARDIO_MIN[a.cardio||'none']};
  let cardioNote=null;
  if(timing.cardio>0 && doorToDoor-timing.warmup-timing.stretch-timing.cardio<18){
    cardioNote=`${doorToDoor} minutes does not leave room for cardio after lifting, so it goes on your rest days instead`;
    timing.cardio=0;
  }
  const liftBudget=Math.max(10, doorToDoor-timing.warmup-timing.stretch-timing.cardio);
  const cap=slotCap(level,999)+(doorToDoor>=75?2:0);   // longer sessions earn a couple more slots
  const split=chooseSplit(days,level);
  const rank=e=>{ const i=order.indexOf(e.equipment); return i<0?99:i; };
  const avail=lib.filter(e=>order.includes(e.equipment));
  const used=new Set();
  const seed=shuffleSeed||0;
  const rot=arr=>{ if(!seed||arr.length<2) return arr;
    const k=seed%arr.length; return arr.slice(k).concat(arr.slice(0,k)); };
  const jitter=arr=>{ if(!seed) return arr;
    return arr.map((x,i)=>{ let h=(((i+1)*73856093)^((seed+1)*19349663))>>>0;
      h=(h^(h>>>13))>>>0; return [x,h%99991]; }).sort((p,q)=>p[1]-q[1]).map(p=>p[0]); };

  const pickCore=pattern=>{
    let pool=avail.filter(e=>e.pattern===pattern&&e.tier==='core').sort((x,y)=>rank(x)-rank(y));
    const top=pool.filter(e=>rank(e)===rank(pool[0]));
    pool=rot(jitter(top)).concat(pool);
    let e=pool.find(x=>!used.has(x.slug))||pool[0];
    if(!e){ const alt=avail.filter(x=>x.pattern===pattern).sort((x,y)=>rank(x)-rank(y));
      e=alt.find(x=>!used.has(x.slug))||alt[0]; }
    if(e) used.add(e.slug);
    return e;
  };
  const pickAcc=(domain,prefer,sUsed)=>{
    let pool=avail.filter(e=>e.tier==='accessory'&&domain.includes(e.muscles[0])&&!sUsed.has(e.slug));
    if(prefer&&prefer.length){
      const p=pool.filter(e=>prefer.includes(e.muscles[0]));
      if(p.length) pool=p;
    }
    if(!pool.length) return null;
    pool=rot(jitter(pool).sort((x,y)=>rank(x)-rank(y)));
    const e=pool.find(x=>!used.has(x.slug))||pool[0];   // fresh if possible, repeat across days is fine
    used.add(e.slug); sUsed.add(e.slug);
    return e;
  };

  const tight=[], paired=[];
  const sessions=split.map(s=>{
    const items=[], sUsed=new Set();
    const mustHave = s.plan==='full' ? Math.min(3,s.patterns.length) : 2;
    const fits=extra=>liftMinutes(items.concat(extra?[extra]:[]))<=liftBudget;

    // core lifts first — at least two, even if they eat the whole budget
    s.patterns.forEach(p=>{
      if(items.length>=Math.max(2,cap-1)) return;
      const e=pickCore(p); if(!e||sUsed.has(e.slug)) return;
      const item={lib:e,tier:'core',sets:goal.core.sets,
        reps:goal.core.reps+(level!=='new'&&items.length===0?'+':''),rest:goal.core.rest};
      if(items.length>=mustHave && !fits(item)) return;
      sUsed.add(e.slug); items.push(item);
    });

    // if the compounds alone overrun, trim rest then sets before dropping a lift
    let cutRest=false, cutSets=false;
    const trim=()=>{ let guard=0;
      while(liftMinutes(items)>liftBudget && guard++<10){
        let moved=false;
        items.forEach(i=>{ if(i.tier==='core'&&i.rest>90){ i.rest=Math.max(90,i.rest-30); moved=cutRest=true; } });
        if(!moved) items.forEach(i=>{ if(i.tier==='core'&&i.sets>3){ i.sets-=1; moved=cutSets=true; } });
        if(!moved) break;
      }
    };
    // drop the optional extras, then shorten rests and sets, and only then give up a movement
    while(liftMinutes(items)>liftBudget && items.length>mustHave){ const d=items.pop(); sUsed.delete(d.lib.slug); }
    trim();
    while(liftMinutes(items)>liftBudget && items.length>2){ const d=items.pop(); sUsed.delete(d.lib.slug); trim(); }
    if(cutRest||cutSets) tight.push(`${s.name}: ${doorToDoor} minutes is tight for ${goal.label.toLowerCase()}, so I ${
      [cutRest?'shortened the rests between sets':null,cutSets?'cut a set off each compound lift':null]
      .filter(Boolean).join(' and ')}`);

    // accessories only while there is room left on the clock
    const dom=DOMAIN[s.plan];
    while(items.length<cap){
      const e=pickAcc(dom,focus.filter(m=>dom.includes(m)),sUsed);
      if(!e) break;
      const item={lib:e,tier:'acc',sets:goal.acc.sets,reps:goal.acc.reps,rest:goal.acc.rest};
      if(!fits(item)){ sUsed.delete(e.slug); used.delete(e.slug); break; }
      items.push(item);
    }
    /* short sessions: pair two accessories rather than drop both */
    let pairN=0;
    while(items.length+2<=cap+1){
      const e1=pickAcc(dom,focus.filter(m=>dom.includes(m)),sUsed);
      if(!e1) break;
      const e2=pickAcc(dom,focus.filter(m=>dom.includes(m)),sUsed);
      if(!e2){ sUsed.delete(e1.slug); used.delete(e1.slug); break; }
      const gid='sup'+(++pairN);
      const p1={lib:e1,tier:'acc',sets:goal.acc.sets,reps:goal.acc.reps,rest:goal.acc.rest,group:gid};
      const p2={lib:e2,tier:'acc',sets:goal.acc.sets,reps:goal.acc.reps,rest:goal.acc.rest,group:gid};
      if(liftMinutes(items.concat([p1,p2]))>liftBudget){
        sUsed.delete(e1.slug); used.delete(e1.slug);
        sUsed.delete(e2.slug); used.delete(e2.slug); break;
      }
      items.push(p1,p2); paired.push(`${e1.name} with ${e2.name}`);
    }
    if(!items.some(i=>i.lib.muscles[0]==='core')){
      const e=pickAcc(['core'],[],sUsed);
      const item=e&&{lib:e,tier:'acc',sets:2,reps:'30s',rest:60};
      if(item&&fits(item)) items.push(item); else if(e){ sUsed.delete(e.slug); used.delete(e.slug); }
    }
    return {...s,items,used:sUsed,budget:liftBudget};
  });

  /* balance pass — nudge weekly sets into the evidence-backed range */
  const targets=volumeTargets(level,focus);
  const log=[];
  for(let pass=0; pass<10; pass++){
    const v=weeklyVolume(sessions);
    let changed=false;
    for(const m of BIG){
      const [lo,hi]=targets[m];
      const trained=sessions.some(s=>s.items.some(i=>i.lib.muscles.includes(m)));
      if(v[m]<lo && trained){
        const host=sessions.filter(s=>DOMAIN[s.plan].includes(m))
          .sort((x,y)=>x.items.length-y.items.length)[0];
        if(host && host.items.length<cap+2){
          const e=pickAcc([m],[m],host.used);
          const trial=e&&{lib:e,tier:'acc',sets:goal.acc.sets,reps:goal.acc.reps,rest:goal.acc.rest};
          if(trial && liftMinutes(host.items.concat([trial]))>liftBudget){
            host.used.delete(e.slug); used.delete(e.slug); continue; }
          if(e){ host.items.push(trial);
            log.push(`${m} was light at ${v[m]} sets, added ${e.name} to ${host.name}`); changed=true; }
        }
      } else if(v[m]>hi){
        for(const s of sessions){
          const i=s.items.map((it,ix)=>({it,ix})).reverse()
            .find(o=>o.it.tier==='acc'&&o.it.lib.muscles[0]===m&&s.items.length>3);
          if(i){ s.items.splice(i.ix,1); s.used.delete(i.it.lib.slug);
            log.push(`${m} was heavy at ${v[m]} sets, dropped ${i.it.lib.name} from ${s.name}`);
            changed=true; break; }
        }
      }
    }
    if(!changed) break;
  }

  const dayList=spreadDays(a.when,days);
  const chosen=sessions.slice(0,Math.max(days,1));
  /* bands are reps BEYOND the prescribed target, not the raw count */
  const rules=(level==='new'||a.goal==='health')
    ? [{min_reps:0,max_reps:2,upper_add:1.25,lower_add:2.5,label:'You hit the target'},
       {min_reps:3,max_reps:5,upper_add:2.5,lower_add:5,label:'A few reps clear'},
       {min_reps:6,max_reps:99,upper_add:5,lower_add:10,label:'Well clear — bigger jump'}]
    : [{min_reps:0,max_reps:2,upper_add:2.5,lower_add:5,label:'You hit the target'},
       {min_reps:3,max_reps:5,upper_add:5,lower_add:10,label:'A few reps clear'},
       {min_reps:6,max_reps:99,upper_add:7.5,lower_add:15,label:'Well clear — bigger jump'}];

  const workouts=chosen.map((s,i)=>({code:s.code,name:s.name,kind:'main',follows:null,
    colour:PALETTE[i%PALETTE.length],position:i+1}));
  const exercises=[];
  chosen.forEach(s=>s.items.forEach((it,i)=>exercises.push({
    workout_code:s.code,name:it.lib.name,sets:it.sets,rep_scheme:it.reps,rest_seconds:it.rest,
    body_area:it.lib.area==='core'?'core':it.lib.area,tracks_weight:it.lib.equipment==='bodyweight'?0:1,
    current_weight:null,fixed_increment:null,is_optional:0,is_rotation:0,
    is_barbell:it.lib.is_barbell,is_core:it.tier==='core'?1:0,group:it.group||null,
    cue:it.lib.cue,position:i+1})));

  const schedule=WEEK.map(d=>({day:d,slot:dayList.includes(d)?'main':'rest',
    cardio: dayList.includes(d)?'' : (WEEK.indexOf(d)%3===1?'Easy walk or cycle':'')}));

  const vol=weeklyVolume(chosen);
  const clocks=chosen.map(s=>({name:s.name,...sessionClock(liftMinutes(s.items),timing)}));
  const longest=clocks.reduce((a,b)=>b.total>a.total?b:a,clocks[0]);
  if(longest.total>doorToDoor+3) tight.push(
    `your longest session comes to about ${longest.total} minutes rather than ${doorToDoor} — `+
    `dropping another exercise would leave a whole movement out of your week`);
  const NICE={quads:'thighs',hamstrings:'back of the legs',glutes:'glutes',chest:'chest',back:'back',
    shoulders:'shoulders',biceps:'biceps',triceps:'triceps',core:'core',calves:'calves'};
  const under=BIG.filter(m=>vol[m]>0&&vol[m]<targets[m][0]-0.5).map(m=>NICE[m]);
  const untrained=['chest','back','quads','hamstrings'].filter(m=>!vol[m]);
  return {name:`My routine`,blurb:`${chosen.length} sessions a week, built around ${goal.label.toLowerCase()}.`,
    source:'Built from your answers using the r/Fitness wiki routine structure and the 10–20 weekly sets per muscle guidance.',
    notes:`Train on ${dayList.join(', ')}. Everything else is a rest day.`+
      (timing.cardio?` Cardio goes at the end of each session.`:''),
    workouts,exercises,rules,schedule,timing,
    _vol:vol,_targets:targets,_log:log.slice(0,6),_days:dayList,_clocks:clocks,_longest:longest,
    _paired:paired,
    _tight:cardioNote?[cardioNote].concat(tight):tight,_budget:liftBudget,_doorToDoor:doorToDoor,
    _under:under,_split:split.length===1?'one session':chosen.length+' sessions',_goal:goal.label,_cap:cap,
    _sessions:chosen.map(s=>({name:s.name,items:s.items.map(i=>`${i.lib.name} ${i.sets}×${i.reps}`)}))};
}


/* ---------- ELO ----------
   Three parts, each earned separately:
     strength    (0-1000) how your best lifts sit against published bodyweight standards
     consistency (0-100)  whether you actually turn up, against your own plan
     programme   (0-100)  how your routine compares with the ones advanced lifters run
   Ratios below are 1RM ÷ bodyweight at Beginner / Novice / Intermediate / Advanced / Elite,
   compiled from the ExRx performance tables, StrengthLevel's dataset and Symmetric Strength.
   They describe trained adults roughly 18-39; outside that they drift, and the app says so. */
const STANDARDS={
  squat:   {m:[0.75,1.25,1.50,2.00,2.50], f:[0.50,0.75,1.25,1.50,2.00], w:1.00, label:'Squat'},
  deadlift:{m:[1.00,1.50,2.00,2.50,3.00], f:[0.50,1.00,1.50,2.00,2.50], w:1.00, label:'Deadlift'},
  bench:   {m:[0.50,0.75,1.25,1.50,2.00], f:[0.25,0.50,0.75,1.00,1.25], w:0.90, label:'Bench press'},
  ohp:     {m:[0.35,0.55,0.80,1.10,1.40], f:[0.20,0.35,0.50,0.75,0.90], w:0.80, label:'Overhead press'},
  row:     {m:[0.50,0.75,1.00,1.25,1.50], f:[0.30,0.45,0.65,0.85,1.00], w:0.80, label:'Row'},
  pulldown:{m:[0.60,0.80,1.00,1.25,1.50], f:[0.35,0.50,0.70,0.90,1.10], w:0.70, label:'Pulldown or chin-up'},
  hinge:   {m:[0.75,1.10,1.50,1.90,2.30], f:[0.40,0.70,1.05,1.35,1.70], w:0.75, label:'Hip hinge'},
  legpress:{m:[1.20,1.80,2.50,3.20,4.00], f:[0.90,1.40,2.00,2.60,3.20], w:0.55, label:'Leg press'}
};
const TIERS=['Untrained','Beginner','Novice','Intermediate','Advanced','Elite'];
const RANKS=[
  {name:'Bronze',      min:0,    blurb:'Getting the movements down and turning up.'},
  {name:'Silver',      min:600,  blurb:'A base is forming. The lifts are moving.'},
  {name:'Gold',        min:1100, blurb:'A real training habit and honest numbers.'},
  {name:'Platinum',    min:1550, blurb:'Stronger than most people who lift at all.'},
  {name:'Diamond',     min:1950, blurb:'Well past intermediate on the main lifts.'},
  {name:'Master',      min:2300, blurb:'Advanced numbers held with a serious programme.'},
  {name:'Grandmaster', min:2650, blurb:'Elite territory. Very few people get here.'}
];
const rankFor=elo=>[...RANKS].reverse().find(r=>elo>=r.min)||RANKS[0];
function nextRank(elo){ return RANKS.find(r=>r.min>elo)||null; }

/* which standard an exercise should be judged against */
function liftKind(e){
  const n=(e.name||'').toLowerCase();
  if(/leg press|hack squat/.test(n)) return 'legpress';
  if(/squat/.test(n)) return 'squat';
  if(/deadlift/.test(n)&&!/romanian|single/.test(n)) return 'deadlift';
  if(/romanian|hip thrust|good morning|back extension/.test(n)) return 'hinge';
  if(/bench|chest press|push-?up|dip/.test(n)) return 'bench';
  if(/overhead press|shoulder press|military/.test(n)) return 'ohp';
  if(/row/.test(n)) return 'row';
  if(/pulldown|chin-?up|pull-?up/.test(n)) return 'pulldown';
  return null;
}
/* 0-1000 by interpolating between the published tiers; 200 points per tier */
function standardPoints(ratio,band){
  if(ratio<=0) return 0;
  if(ratio<band[0]) return Math.max(0,Math.round(200*ratio/band[0]));
  for(let i=0;i<band.length-1;i++){
    if(ratio<band[i+1])
      return Math.round(200*(i+1)+200*(ratio-band[i])/(band[i+1]-band[i]));
  }
  /* past Elite it keeps climbing but with diminishing return */
  return Math.min(1000,Math.round(1000+120*Math.log2(ratio/band[band.length-1])));
}
function tierName(ratio,band){
  let i=0; while(i<band.length&&ratio>=band[i]) i++;
  return TIERS[Math.min(i,TIERS.length-1)];
}

function strengthScore(){
  const kg=bodyKg(), sex=D.settings.standards;
  if(!kg||!sex||sex==='none') return null;
  const s=sex==='f'?'f':'m';
  const best={};
  (R()?.exercises||[]).forEach(e=>{
    const k=liftKind(e); if(!k||!e.tracks_weight) return;
    const hs=history(e.id);
    let top=e.current_weight?{w:e.current_weight,r:targetReps(e)||5}:null;
    hs.forEach(h=>{ if(!top||(e1rm(h.w,h.r)||0)>(e1rm(top.w,top.r)||0)) top=h; });
    if(!top||!top.w) return;
    const one=e1rm(top.w,top.r||5);
    if(!best[k]||one>best[k].one) best[k]={one,name:e.name,w:top.w,r:top.r};
  });
  const rows=Object.keys(best).map(k=>{
    const band=STANDARDS[k][s], ratio=best[k].one/kg;
    return {kind:k,label:STANDARDS[k].label,weight:STANDARDS[k].w,name:best[k].name,
      one:best[k].one,ratio:round(ratio),pts:standardPoints(ratio,band),
      tier:tierName(ratio,band),band};
  });
  if(!rows.length) return null;
  const wsum=rows.reduce((a,r)=>a+r.weight,0);
  const raw=rows.reduce((a,r)=>a+r.pts*r.weight,0)/wsum;
  /* you cannot be graded on curls alone: three big lifts is full credit */
  const bigCovered=rows.filter(r=>['squat','deadlift','bench','ohp'].includes(r.kind)).length;
  const coverage=Math.min(1,0.55+0.15*bigCovered);
  return {rows,score:Math.round(raw*coverage),coverage,bigCovered};
}
function consistencyScore(){
  const r=R(); if(!r) return {score:0,per:0,planned:0};
  const since=Date.now()-28*864e5;
  const done=L.sessions.filter(s=>new Date(s.performed_on+'T00:00:00').getTime()>=since).length;
  const planned=Math.max(1,(r.schedule||[]).filter(d=>d.code).length*(r.cycle===2?2:4));
  const ratio=Math.min(1.1,done/planned);
  return {score:Math.round(Math.min(100,ratio*100)),per:round(done/4),planned:round(planned/4),done};
}
/* how the routine compares with what advanced lifters actually run */
function programmeScore(){
  const r=R(); if(!r||!r.exercises.length) return {score:0,notes:['No routine yet']};
  const notes=[]; let s=0;
  const pats=new Set(r.exercises.map(e=>e.pattern||
    (SEED.library.find(x=>x.name===e.name)||{}).pattern).filter(Boolean));
  const need=[['squat','squat'],['hinge','hinge'],['hpush','horizontal push'],
    ['vpush','overhead press'],['hpull','row'],['vpull','pulldown or chin-up']];
  const have=need.filter(([p])=>pats.has(p));
  s+=Math.round(40*have.length/need.length);
  const missing=need.filter(([p])=>!pats.has(p)).map(x=>x[1]);
  if(missing.length) notes.push('no '+missing.join(', no '));
  const days=(r.schedule||[]).filter(d=>d.code).length/(r.cycle===2?2:1);
  s+=days>=4?25:days>=3?18:days>=2?10:4;
  if(days<3) notes.push('training '+round(days)+' days a week');
  const items=r.exercises.map(e=>({sets:e.sets,lib:SEED.library.find(x=>x.name===e.name)||{muscles:['core']}}));
  const vol={}; items.forEach(i=>(i.lib.muscles||[]).forEach((m,ix)=>vol[m]=(vol[m]||0)+i.sets*(ix?0.5:1)));
  const inRange=['chest','back','quads','hamstrings','shoulders'].filter(m=>(vol[m]||0)>=8).length;
  s+=Math.round(20*inRange/5);
  if(inRange<4) notes.push('weekly sets light on '+
    ['chest','back','quads','hamstrings','shoulders'].filter(m=>(vol[m]||0)<8).join(', '));
  const prog=r.exercises.some(e=>e.prog==='stage')||(r.rules||[]).length>=3;
  s+=prog?15:5;

}
function eloFor(){

  const mult=0.62+0.23*c+0.15*p;
  const lifted=Math.round(strengthPts*2.2*mult);
  const habit=Math.round(c*150), plan=Math.round(p*100);
  const elo=Math.min(3000,lifted+habit+plan);
  return {elo,rank:rankFor(elo),next:nextRank(elo),strength:st,consistency:co,programme:pr,
    parts:[{k:'What you lift',v:lifted,max:2200},
           {k:'Turning up',v:habit,max:150},

    mult:round(mult)};
}

/* Progression works off reps BEYOND the target, never the raw count — a 12-rep
   accessory hitting 12 is doing what it was told, not shouting that it is too light. */
function targetReps(e){
  const r=String(e.rep_scheme).replace('+','').trim();
  if(/s$/i.test(r)) return null;          // timed holds do not progress on reps
  const n=parseInt(r); return isNaN(n)?null:n;
}
const isCoreLift=e=>!!(e.is_core??(e.rest_seconds>=120?1:0));
const repCeiling=e=>targetReps(e)+(e.rep_top??3);
/* never add more than a fifth of the current load in one go */
function capAdd(w,add){
  if(!add) return w;
  return round(w+Math.min(add, Math.max(inc(), w*0.2)));
}
function progMode(e){
  if(e.prog&&e.prog!=='auto') return e.prog;
  return isCoreLift(e)?'linear':'double';
}
/* how hard it felt can veto a jump — only used when the user turns effort logging on */
function nextWeight(e,reps,effort){
  if(!e.tracks_weight||e.current_weight===null||reps===null||reps===''||isNaN(reps)) return e.current_weight;
  if(easyMode()) return e.current_weight;
  const mode=progMode(e);
  if(mode==='hold') return e.current_weight;
  const tgt=targetReps(e);
  if(tgt===null) return e.current_weight;
  if(effort==='hard'&&reps<=tgt+2) return e.current_weight;
  if(mode==='stage') return e.current_weight;   // stages change sets/reps, not load, until they run out
  if(e.fixed_increment!==null&&e.fixed_increment!==undefined)
    return reps>=tgt?capAdd(e.current_weight,e.fixed_increment):e.current_weight;
  if(mode==='double'){
    if(reps<repCeiling(e)) return e.current_weight;
    return round(e.current_weight+(e.body_area==='lower'?inc()*2:inc()));
  }
  const over=reps-tgt;
  if(over<0) return e.current_weight;
  let r=(R().rules||[]).find(x=>over>=x.min_reps&&over<=x.max_reps);
  if(effort==='easy'&&r){ const i=(R().rules||[]).indexOf(r);
    r=(R().rules||[])[Math.min(i+1,(R().rules||[]).length-1)]||r; }
  return r?capAdd(e.current_weight,(e.body_area==='lower'?r.lower_add:r.upper_add)):e.current_weight;
}
/* stage progression (GZCLP-style): miss the target and the set/rep shape changes

function advanceStage(e,reps){
  if(progMode(e)!=='stage'||!e.stages||!e.stages.length) return null;
  const tgt=targetReps(e);
  if(reps>=tgt) return null;                       // still making it, stay put
  const at=(e.stage||0)+1;
  if(at<e.stages.length){
    e.stage=at; e.sets=e.stages[at].sets; e.rep_scheme=e.stages[at].reps;
    return `${e.name}: moved to ${e.sets}×${e.rep_scheme} at the same weight`;
  }
  e.stage=0; e.sets=e.stages[0].sets; e.rep_scheme=e.stages[0].reps;
  e.current_weight=snap(e.current_weight*0.9);
  return `${e.name}: stages used up, dropped to ${fmt(e.current_weight)} ${U()} and back to ${e.sets}×${e.rep_scheme}`;
}

}

/* rest timer, with a notification if the phone allows one */
function notifyRest(){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  try{
    if(window.Notification && Notification.permission==='granted')
      new Notification('Rest is up', {body:'Next set.', tag:'cau-rest'});
  }catch(e){}
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const a=new C(), o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(.001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.7);
    o.start(); o.stop(a.currentTime+.75);
  }catch(e){}
}

/* every routine, however it was created, gets the same normalising pass */
function normalise(r){
  r.cycle=r.cycle||1;
  (r.schedule||[]).forEach(d=>{ d.week=d.week||1; });
  r.exercises.forEach(e=>{
    const lib=SEED.library.find(x=>x.name===e.name)||{};
    if(e.pattern===undefined||e.pattern==='') e.pattern=lib.pattern||'';
    if(e.group===undefined) e.group=null;
    if(e.prog===undefined) e.prog='auto';
    if(e.stackStep===undefined)                       // machines get a pin number
      e.stackStep=(lib.equipment==='machine'||lib.equipment==='cable')?(U()==='kg'?5:10):null;
    if(e.prog==='stage'&&!e.stages) e.stages=[{sets:e.sets,reps:e.rep_scheme}];
    if(e.target===undefined) e.target=null;
  });
  /* GZCLP's heavy lifts really do change shape on a miss */
  if(/GZCLP/i.test(r.name)) r.exercises.forEach(e=>{
    if(String(e.rep_scheme).startsWith('3')&&e.sets>=5&&e.prog==='auto'){
      e.prog='stage'; e.stage=0;
      e.stages=[{sets:5,reps:'3+'},{sets:6,reps:'2+'},{sets:10,reps:'1+'}];
    }
  });
  return r;
}

/* exercises flagged to rotate (grip work, core work) — you do one, not all of them */
function rotationGroups(code,r){
  const groups={};
  exOf(code,r).forEach(e=>{ if(e.is_rotation){ const k=e.body_area||'other';
    (groups[k]=groups[k]||[]).push(e); } });
  Object.keys(groups).forEach(k=>{ if(groups[k].length<2) delete groups[k]; });
  return groups;
}
const ROT_LABEL={grip:'Grip work',core:'Core work',upper:'Upper accessory',lower:'Lower accessory',other:'Pick one'};
function leastRecent(list){
  const last={};
  L.sessions.forEach(s=>(s.sets||[]).forEach(x=>{ if(last[x.exId]===undefined) last[x.exId]=s.performed_on; }));
  return [...list].sort((a,b)=>((last[a.id]||'')>(last[b.id]||''))?1:-1)[0];
}

/* same muscle, same movement — whatever machine is free */
function variantsFor(e){
  const lib=SEED.library.find(x=>x.name===e.name);
  const pat=e.pattern||lib?.pattern, m=lib?lib.muscles[0]:null;
  return SEED.library.filter(x=>x.name!==e.name&&(x.pattern===pat||(m&&x.muscles[0]===m)))
    .slice(0,8);
}

/* ---------- session walkthrough ---------- */
function buildFlow(code){
  const list=exOf(code), stops=[], seen=new Set();
  list.forEach(e=>{
    if(seen.has(e.id)) return;
    if(e.group){
      const mates=list.filter(x=>x.group===e.group);
      mates.forEach(m=>seen.add(m.id));
      stops.push(mates.map(m=>m.id));
    } else { seen.add(e.id); stops.push([e.id]); }
  });
  return {code,i:0,order:stops,started:Date.now(),extras:[]};
}

const flowSteps=()=>2+flow.order.length+1;

}

      </div>`;
    });
    body+=`<div class="row-btns"><button class="mini" id="park">Machine's busy — do this later</button>
      <button class="mini" id="logmode">${{last:'Logging the last set',same:'Same reps every set',
        each:'Logging every set'}[D.settings.logMode||'last']}</button></div>`;
  } else if(flow.i===flow.order.length+1){
    const ck=clockFor(flow.code);
    body+=`<h2>Stretch it out</h2><p class="small muted">About ${ck?ck.stretch:10} minutes.</p><div class="card">`;
    D.mobility.filter(m=>m.phase==='post').forEach((m,i)=>
      body+=`<button class="check ${checks['post'+i]?'done':''}" data-check="post${i}">
        <span class="box">✓</span><span class="t">${esc(m.name)}</span><span class="r">${esc(m.prescription)}</span></button>`);
    body+=`</div>`;
  } else {
    const mins=Math.max(1,Math.round((Date.now()-flow.started)/60000));
    const kc=kcalFor(flow.code,mins);
    const rows=flowExercises().map(e=>{
      const per=perSetReps(e), v=per?per.filter(x=>x!==null).slice(-1)[0]:entries[e.id];
      const done=Array.from({length:e.sets},(_,i)=>checks[`s${e.id}_${i+1}`]).filter(Boolean).length;
      if(v===''||v===undefined) return `<li>${esc(e.name)}<span class="r">skipped</span></li>`;
      return `<li>${esc(e.name)}<span class="r">${done} of ${e.sets} sets · ${
        per?per.filter(x=>x!==null).join(', ')+' reps':v+' reps'}${
        e.current_weight!==null?` · next ${fmt(nextWeight(e,Number(v),entries['eff'+e.id]))} ${U()}`:''}</span></li>`; }).join('');
    body+=`<h2>All done</h2><div class="card"><ul class="plain">${rows}</ul></div>
      <div class="card"><h3>This session</h3><ul class="plain">
        <li>Time<span class="r">${mins} minutes</span></li>
        ${kc?`<li>Rough energy used<span class="r">${kc.kcal} kcal</span></li>`:''}
        <li>Sets finished<span class="r">${flowExercises().reduce((a,e)=>
          a+Array.from({length:e.sets},(_,i)=>checks[`s${e.id}_${i+1}`]).filter(Boolean).length,0)}</span></li>
        ${easyMode()?`<li>Easy week<span class="r">weights held</span></li>`:''}
      </ul>${kc?`<p class="tiny muted" style="margin:8px 0 0">Energy is a rough estimate from your bodyweight
        and how hard the session was, using standard MET values. Treat it as a ballpark, not a measurement.</p>`
        :`<p class="tiny muted" style="margin:8px 0 0">Record your bodyweight under Settings and I can estimate
        the energy used.</p>`}</div>
      ${(flow.extras||[]).length?`<div class="card"><h3>Also did</h3><ul class="plain">${
        flow.extras.map((x,i)=>`<li>${esc(x.name)}<span class="r">${esc(x.detail)} <button class="mini danger" data-rmextra="${i}">remove</button></span></li>`).join('')}</ul></div>`:''}
      <div class="row-btns"><button class="mini" id="addextra">Add something else you did</button></div>
      <div class="field" style="margin-top:12px"><label>Anything worth noting?</label>
        <input type="text" id="snote" placeholder="felt strong, left knee a bit tight…"></div>
      <button class="cta" id="finish">Save this session</button>
      <button class="cta ghost" id="abandon">Throw it away</button>`;
  }
  const bar = flow.i<flowSteps()-1
    ? `<div class="flowbar"><button class="prev" id="fprev">${flow.i===0?'Quit':'Back'}</button>
       <button class="next" id="fnext">Next</button></div>` : '';
  return h+`<div class="withrail"><div class="railmain">${body}${bar}</div>${railHTML()}</div>`;
}

/* ---------- ELO ---------- */

  let h=`<h2>Your score</h2>
    <div class="card pick" style="--c:var(--accent)">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div><div class="num" style="font-size:46px;line-height:1">${E.elo}</div>
          <div class="nm">${esc(E.rank.name)}</div></div>
        <div class="tiny muted" style="text-align:right;max-width:52%">${esc(E.rank.blurb)}</div></div>
      <div style="height:8px;background:var(--wash);border-radius:4px;margin-top:12px">
        <div style="height:8px;width:${pct}%;background:var(--accent);border-radius:4px"></div></div>
      ${E.next?`<div class="tiny muted" style="margin-top:6px">${E.next.min-E.elo} points to ${esc(E.next.name)}</div>`
        :`<div class="tiny muted" style="margin-top:6px">Top rank.</div>`}

  if(E.strength){
    h+=`<div class="card"><h3>Your lifts against the standards</h3><ul class="plain">`;
    E.strength.rows.sort((a,b)=>b.pts-a.pts).forEach(r2=>
      h+=`<li><div>${esc(r2.label)}<div class="tiny muted">${esc(r2.name)} · best about ${fmt(r2.one)} ${U()} for one</div></div>
        <span class="r">${r2.ratio}× bodyweight<br><b>${esc(r2.tier)}</b></span></li>`);
    h+=`</ul><p class="tiny muted" style="margin:10px 0 0">Ratios are an estimated one-rep max divided by
      your bodyweight, compared with the ExRx performance tables, StrengthLevel's dataset and Symmetric
      Strength. They describe trained adults roughly 18–39 — outside that, read them loosely.</p></div>`;
  } else {
    h+=`<div class="card"><h3>Half the score is missing</h3>
      <p class="small muted">Strength is worth 1800 of the 3000 points and I can't work it out without
      your bodyweight and which standards to compare against.</p>
      <div class="field"><label>Bodyweight (${U()})</label>${stepper('bw','x',bodyKg(),U())}</div>
      <div class="field"><label>Compare my lifts against</label><select id="stdsel">
        <option value="">choose one</option>
        <option value="m" ${D.settings.standards==='m'?'selected':''}>men's standards</option>
        <option value="f" ${D.settings.standards==='f'?'selected':''}>women's standards</option>
        <option value="none" ${D.settings.standards==='none'?'selected':''}>don't compare me</option>
      </select></div><button class="mini go" id="savestd">Save</button></div>`;
  }
  h+=`<div class="card"><h3>How to move it</h3><ul class="plain">`;
  tips.forEach(t2=>h+=`<li><div>${esc(t2)}</div></li>`);
  h+=`</ul></div>
    <div class="card"><h3>The ranks</h3><ul class="plain">`;
  RANKS.forEach(r3=>h+=`<li><div>${esc(r3.name)}${r3.name===E.rank.name?' <span class="badge">you</span>':''}
    <div class="tiny muted">${esc(r3.blurb)}</div></div><span class="r">${r3.min}+</span></li>`);

      h+=`<div class="chips">`;

      h+=`</div><div class="card">${chartSVG(history(statEx),U())}
        ${(()=>{ const hs=history(statEx);
          const best=hs.reduce((a,b)=>(e1rm(b.w,b.r)||0)>(a?e1rm(a.w,a.r):0)?b:a,null);
          return best?`<p class="tiny muted" style="margin:8px 0 0">Best set so far: ${fmt(best.w)} ${U()} × ${best.r}
            — about ${fmt(e1rm(best.w,best.r))} ${U()} for a single.</p>`:''; })()}</div>`;

  if(!L.sessions.length) h+=`<div class="empty">Nothing logged yet.</div>`;
  L.sessions.slice(0,40).forEach(s=>h+=sessionRow(s,true));

}

/* ---------- plan ---------- */
function viewPlan(){
  if(addex) return viewPicker();
  if(editing) return viewEdit();
  const r=R();
  if(!r) return `<div class="card"><h3>No routine yet</h3>
    <button class="cta" id="newroutine">Set up a routine</button></div>`;
  let h=`<h2>${esc(r.name)}</h2>`;
  if(r.blurb) h+=`<div class="card"><p class="small muted" style="margin:0">${esc(r.blurb)}</p>
    ${r.source?`<p class="tiny muted" style="margin:8px 0 0">${esc(r.source)}</p>`:''}</div>`;
  r.workouts.forEach(w=>{
    const c=clockFor(w.code,r);
    h+=`<div class="card pick" style="--c:${w.colour}"><h3>${esc(w.name)}</h3>
      <div class="tiny muted" style="margin-bottom:8px">${c?`About ${c.total} min · `:''}done ${doneCount(w.code)}×</div>
      <ul class="plain">`;
    exOf(w.code,r).forEach(e=>h+=`<li><div>${esc(e.name)}${(e.sessions_at_weight||0)>=3
      ?`<div class="tiny" style="color:#B7242B">stuck ${e.sessions_at_weight} sessions</div>`:''}</div>
      <span class="r">${e.group?`<span class="tiny">superset ${esc(e.group)} · </span>`:''}${e.sets} × ${esc(e.rep_scheme)}${
      e.current_weight!==null?` · ${fmt(e.current_weight)} ${U()}`:''}</span></li>`);
    h+=`</ul></div>`;
  });
  const vol=routineVolume(r);
  const low=Object.keys(vol).filter(m=>vol[m]>0&&vol[m]<6).map(m=>MUSCLE_LABEL[m]);
  const thin=r.workouts.filter(w=>exOf(w.code,r).length<=2);
  if(low.length||thin.length){
    h+=`<div class="card"><h3>Worth knowing</h3>`;
    if(low.length) h+=`<p class="small muted">Across the ${(r.cycle||1)===2?'fortnight':'week'} your
      ${esc(low.join(', '))} get fewer than 6 sets. Research points at 10–20 for building muscle. Another day,
      another 15 minutes, or an extra exercise would close it.</p>`;
    if(thin.length) h+=`<p class="small muted">${esc(thin.map(w=>w.name).join(', '))}
      ${thin.length===1?'has':'have'} only a couple of exercises. If you can spare ten more minutes,
      add one — supersetting two accessories costs almost no extra time.</p>`;
    h+=`<button class="mini" id="editroutine">Add an exercise</button></div>`;
  }
  h+=`<button class="cta" id="editroutine">Edit this routine</button>
    <div class="row-btns"><button class="mini" id="targets">Targets</button>
      <button class="mini" id="schedule">Change the schedule</button>
      <button class="mini" id="switchroutine">Switch or add a routine</button></div>`;
  const wkNow=cycleWeek(r);
  h+=`<h2>Your ${r.cycle===2?'fortnight':'week'}</h2>${r.cycle===2
    ?`<p class="small muted">You're in week ${wkNow} right now.</p>`:''}<div class="card"><table class="week"><tbody>`;
  (r.schedule||[]).forEach(d=>{
    const ww=d.code?wk(d.code,r):null;
    h+=`<tr${r.cycle===2&&(d.week||1)===wkNow?' style="background:var(--wash)"':''}><td>${r.cycle===2?`Wk ${d.week||1} `:''}${esc(d.day)}</td>
      <td>${ww?`<span class="tag" style="background:${ww.colour}">${esc(ww.code)}</span> ${esc(ww.name)}`
        :'<span class="muted small">Rest</span>'}</td>
      <td class="tiny muted">${esc(d.cardio||'')}</td></tr>`;
  });
  h+=`</tbody></table>${r.notes?`<p class="small muted" style="margin:10px 0 0">${esc(r.notes)}</p>`:''}</div>`;
  const pg=programmeScore();
  if(pg.notes.length) h+=`<div class="card"><h3>Worth knowing about this routine</h3>
    <ul class="plain">${pg.notes.map(n=>`<li><div>${esc(n[0].toUpperCase()+n.slice(1))}.</div></li>`).join('')}</ul>
    <p class="tiny muted" style="margin:8px 0 0">Not faults — just what this plan does and doesn't cover.
    Another day, another 15 minutes, or pairing two exercises are the usual levers.</p></div>`;
  h+=`<h2>What the numbers mean</h2><div class="card">
    <h3>“3 × 5+”</h3><p class="small muted">Three sets. The first two are five reps. On the last set you keep
    going for as many as you can do cleanly, stopping with one or two good ones left in you.</p>
    <h3>Picking your first weight</h3><p class="small muted">Start with the empty bar or the lightest pin and do
    five reps. If it was easy, add a little and try again. Stop when the reps slow or your form wobbles.</p></div>`;
  return h;
}

let saveFailed=false;
async function persist(){
  const ok1=await store.set(KEY_D,D), ok2=await store.set(KEY_L,L);
  saveFailed=!(ok1&&ok2);
  return;
}
async function _persistUnused(){ await store.set(KEY_D,D); await store.set(KEY_L,L); }

function perSetReps(e){
  const mode=D.settings.logMode||'last';
  const out=[];
  for(let i=1;i<=e.sets;i++){
    const v=entries['ps'+e.id+'_'+i];
    out.push(v===''||v===undefined?null:Number(v));
  }
  if(mode==='each'&&out.some(x=>x!==null)) return out;
  const one=entries[e.id];
  if(one===''||one===undefined) return null;
  if(mode==='same') return Array(e.sets).fill(Number(one));
  return null;                                     // 'last' keeps a single number
}
function commitSession(code,notes){
  const r=R(), changes=[], sets=[], stageNotes=[];
  (flow?flowExercises():exOf(code)).forEach(e=>{
    const per=perSetReps(e);
    let raw=entries[e.id];
    if(per&&per.some(x=>x!==null)) raw=per.filter(x=>x!==null).slice(-1)[0];
    if(raw===undefined||raw==='') return;
    const reps=Number(raw), from=e.current_weight;
    const effort=entries['eff'+e.id];
    const to=nextWeight(e,reps,effort);
    const done=Array.from({length:e.sets},(_,i)=>checks[`s${e.id}_${i+1}`]).filter(Boolean).length;
    const pb=pbCheck(e,reps);
    sets.push({exId:e.id,name:e.name,sets:e.sets,setsDone:done||e.sets,weight:from,reps,pb:pb?pb.now:null,
      repsPerSet:per||null,effort:effort||null});
    e.sessions=(e.sessions||0)+1;
    const note=advanceStage(e,reps); if(note) stageNotes.push(note);
    if(to!==from){ e.sessions_at_weight=0; e.last_reps=0; }
    else if(reps>(e.last_reps||0)){ e.sessions_at_weight=0; e.last_reps=reps; }   // gaining reps is progress
    else e.sessions_at_weight=(e.sessions_at_weight||0)+1;
    e.current_weight=to;
    changes.push({id:e.id,name:e.name,from,to,reps});
  });
  if(!changes.length&&!(flow?.extras||[]).length) return null;
  const mins=flow?Math.max(1,Math.round((Date.now()-flow.started)/60000)):null;
  const kc=mins?kcalFor(code,mins):null;
  L.sessions.unshift({id:Date.now(),routineId:r.id,workout_code:code,performed_on:today(),
    changes,sets,extras:flow?.extras||[],notes:notes||'',minutes:mins,kcal:kc?kc.kcal:null,
    easy:easyMode()||null,stageNotes});
  entries={}; checks={};
  return changes;
}
function collectEdits(){
  const r=D.routines.find(x=>x.id===(editing||D.settings.activeId)); if(!r) return;
  document.querySelectorAll('[data-f]').forEach(el=>{
    const e=r.exercises.find(x=>x.id===Number(el.dataset.id)); if(!e) return;
    const f=el.dataset.f,v=el.value;
    if(f==='sets'||f==='rest_seconds') e[f]=Number(v)||1;
    else if(f==='current_weight'){ e[f]=v===''?null:Number(v); e.tracks_weight=v===''?0:1; }
    else if(f==='stackStep') e[f]=v===''?null:Number(v);
    else if(f==='group') e[f]=(v||'').trim().toUpperCase().slice(0,1)||null;
    else e[f]=v;
  });
}
function newExercise(r,code,name,extra){
  const pos=Math.max(0,...exOf(code,r).map(e=>e.position))+1;
  r.exercises.push(Object.assign({id:Date.now()+Math.floor(Math.random()*9999),workout_code:code,name,
    sets:3,rep_scheme:'10',rest_seconds:90,body_area:'upper',tracks_weight:1,current_weight:null,
    fixed_increment:null,is_optional:0,is_rotation:0,is_barbell:0,is_core:0,pattern:'',cue:'',
    sessions:0,sessions_at_weight:0,position:pos},extra||{}));
}
function convertUnits(to){
  const f=to==='lb'?2.20462:1/2.20462, g=to==='lb'?2.5:1.25;
  const rnd=x=>x===null||x===undefined?x:Math.round(x*f/g)*g;
  D.routines.forEach(r=>{
    r.exercises.forEach(e=>{ e.current_weight=rnd(e.current_weight); e.fixed_increment=rnd(e.fixed_increment); });
    (r.rules||[]).forEach(x=>{ x.upper_add=rnd(x.upper_add); x.lower_add=rnd(x.lower_add); }); });
  D.bodyweight.forEach(b=>b.kg=Math.round(b.kg*f*10)/10);
  L.sessions.forEach(s=>{                       // history converts too, or the graphs mix units
    (s.sets||[]).forEach(x=>{ if(x.weight!=null) x.weight=rnd(x.weight); });
    (s.changes||[]).forEach(c=>{ if(c.from!=null) c.from=rnd(c.from); if(c.to!=null) c.to=rnd(c.to); });
  });
  D.settings.barWeight=to==='lb'?45:20; D.settings.units=to;
}

      bodyweight:D.bodyweight,settings:D.settings},null,1);
    else{
      const rows=[['date','routine','session','exercise','weight_'+U(),'sets_done','sets_planned','reps','reps_per_set','effort','minutes','kcal','notes']];
      L.sessions.forEach(s=>{ const rr=D.routines.find(x=>x.id===s.routineId);
        (s.sets||[]).forEach(x=>rows.push([s.performed_on,rr?rr.name:'',s.workout_code,
          x.name||'',x.weight??'',x.setsDone??'',x.sets??'',x.reps??'',
          (x.repsPerSet||[]).join(' ')||'',x.effort||'',s.minutes??'',s.kcal??'',
          (s.notes||'').replace(/[,\n]/g,' ')]));
        (s.extras||[]).forEach(x=>rows.push([s.performed_on,rr?rr.name:'',s.workout_code,
          x.name+' (extra)','','','','',''  ,'',s.minutes??'',s.kcal??'','']));
      });
      txt=rows.map(r=>r.join(',')).join('\n');
    }
    try{ await navigator.clipboard.writeText(txt); toast('Copied to your clipboard.'); }
    catch(e){ ask({title:'Your data',kind:'area',value:txt,cancel:'Close',
      body:'Select it all and copy.'}); }
    return; }

  /* settings */
  if(t.dataset.accent){ D.settings.accent=t.dataset.accent; await persist(); render(); return; }
  if(t.dataset.theme){ D.settings.theme=t.dataset.theme; await persist(); render(); return; }
  if(t.id==='savesettings'){
    D.profile.name=document.getElementById('uname')?.value||D.profile.name;
    const g=document.getElementById('guide'); if(g) D.settings.guided=g.value==='1';
    const sd=document.getElementById('stdsel'); if(sd&&sd.value) D.settings.standards=sd.value;
    const av=document.getElementById('adv'); if(av) D.settings.advanced=av.value==='1';
    const lm=document.getElementById('logmodesel'); if(lm) D.settings.logMode=lm.value;
    const ef=document.getElementById('effortsel'); if(ef) D.settings.effort=ef.value==='1';
    const nt=document.getElementById('notify'); if(nt) D.settings.notify=nt.value==='1';
    if(D.settings.notify&&window.Notification&&Notification.permission==='default')
      try{ Notification.requestPermission(); }catch(e){}
    const bw=document.getElementById('barw'); if(bw) D.settings.barWeight=Number(bw.value)||20;
    const wm=document.getElementById('warmm');
    if(wm&&R()) R().timing={warmup:Number(wm.value)||0,
      stretch:Number(document.getElementById('strm').value)||0,
      cardio:Number(document.getElementById('cardm').value)||0};
    const un=document.getElementById('units');
    if(un&&un.value!==D.settings.units) convertUnits(un.value);
    await persist(); toast('Settings saved.'); render(); return; }
  if(t.id==='addfb'){ const v=document.getElementById('fbnew').value.trim();
    if(!v){ toast('Nothing to save yet.'); return; }
    D.feedback.unshift({on:today(),text:v}); await persist(); toast('Noted.'); render(); return; }
  if(t.dataset.rmfb!==undefined){ D.feedback.splice(Number(t.dataset.rmfb),1); await persist(); render(); return; }
  if(t.id==='copyfb'){
    const txt=D.feedback.map(f=>`${f.on} — ${f.text}`).join('\n');
    try{ await navigator.clipboard.writeText(txt); toast('Copied.'); }
    catch(e){ ask({title:'Your notes',kind:'area',value:txt,cancel:'Close'}); }
    return; }
});
document.addEventListener('input', ev=>{
  const el=ev.target;
  if(el.dataset.reps!==undefined) entries[el.dataset.reps]=el.value;
  if(el.dataset.psreps!==undefined) entries['ps'+el.dataset.psreps]=el.value;
});

/* ---------- boot ---------- */
(async function(){
  D=await store.get(KEY_D)||await store.get(OLD_D);
  L=await store.get(KEY_L)||await store.get(OLD_L);
  if(!D) D={profile:{name:''},settings:{},routines:[],cardio:SEED.cardio,mobility:SEED.mobility,
    bodyweight:[],feedback:[]};
  D.settings=Object.assign({units:'kg',theme:'auto',accent:'iron',guided:true,barWeight:20,
    advanced:false,notify:true,activeId:null,logMode:'last',effort:false,easyUntil:null,
    standards:null,levelUpDismissed:false,
    comebackSeen:false},D.settings||{});
  if(D.settings.easyUntil&&D.settings.easyUntil<today()) D.settings.easyUntil=null;
  D.cardio=D.cardio||SEED.cardio; D.mobility=D.mobility||SEED.mobility;
  D.bodyweight=D.bodyweight||[]; D.routines=D.routines||[]; D.feedback=D.feedback||[];
  D.schedEdit=false;
  if(!L) L={sessions:[]};
  const GENTLE=[{min_reps:0,max_reps:2,upper_add:1.25,lower_add:2.5,label:'You hit the target'},
    {min_reps:3,max_reps:5,upper_add:2.5,lower_add:5,label:'A few reps clear'},
    {min_reps:6,max_reps:99,upper_add:5,lower_add:10,label:'Well clear — bigger jump'}];
  const STDB=[{min_reps:0,max_reps:2,upper_add:2.5,lower_add:5,label:'You hit the target'},
    {min_reps:3,max_reps:5,upper_add:5,lower_add:10,label:'A few reps clear'},
    {min_reps:6,max_reps:99,upper_add:7.5,lower_add:15,label:'Well clear — bigger jump'}];
  if(daysSinceLast()!==null&&daysSinceLast()<14) D.settings.comebackSeen=false;
  D.routines.forEach(r=>{
    if(r.progVersion!==2){                       // bands used to key off the raw rep count
      const gentle=(r.rules||[]).some(x=>x.min_reps>=10);
      r.rules=JSON.parse(JSON.stringify(gentle?GENTLE:STDB));
      r.progVersion=2;
      r.exercises.forEach(e=>{ e.last_reps=0; e.sessions_at_weight=0; });
    }
    normalise(r);
  });
  if(!D.routines.length) wiz={step:0,a:{}};
  await persist();
  render();
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
