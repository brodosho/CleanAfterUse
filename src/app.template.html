function chartSVG(pts,unit){
  if(pts.length<2) return `<p class="tiny muted">Two sessions needed before there's a line to draw.</p>`;
  const ws=pts.map(p=>p.w),lo=Math.min(...ws),hi=Math.max(...ws),sp=(hi-lo)||1;
  const X=i=>8+(i/(pts.length-1))*84, Y=w=>90-((w-lo)/sp)*70;
  const line=pts.map((p,i)=>`${X(i)},${Y(p.w)}`).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.w)}" r="1.6" fill="currentColor"/>`).join('');
  return `<svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none" role="img"
      aria-label="weight over time">
    <line x1="8" y1="20" x2="92" y2="20" stroke="currentColor" stroke-width=".4" opacity=".25"/>
    <line x1="8" y1="90" x2="92" y2="90" stroke="currentColor" stroke-width=".4" opacity=".25"/>
    <polyline points="${line}" fill="none" stroke="currentColor" stroke-width="1.6"

    <span>${esc(pts[0].d||'')} · ${fmt(lo)} ${unit}</span><span>${esc(pts[pts.length-1].d||'')} · ${fmt(hi)} ${unit}</span></div>`;
}
function cycleWeek(r){
  if((r?.cycle||1)<2) return 1;
  const start=new Date((r.created||today())+'T00:00:00');
  const days=Math.floor((Date.now()-start.getTime())/86400000);
  return (Math.floor(Math.max(0,days)/7)%2)+1;
}
function suggestion(){
  const r=R(); if(!r||!r.workouts.length) return null;
  const mine=L.sessions.filter(s=>s.routineId===r.id);
  const day=new Date().toLocaleDateString(undefined,{weekday:'long'});
  const wkNow=cycleWeek(r);
  const planned=(r.schedule||[]).find(d=>d.day===day&&d.code&&((r.cycle||1)<2||(d.week||1)===wkNow));
  if(planned && !mine.some(s=>s.performed_on===today()&&s.workout_code===planned.code))
    return {code:planned.code, why:`Your plan puts this on a ${day}${(r.cycle||1)===2?`, week ${wkNow}`:''}`};
  return nextInRotation(r);
}
function nextInRotation(r,why){

  const i=r.workouts.findIndex(m=>m.code===last.workout_code);
  return {code:r.workouts[(i+1)%r.workouts.length].code,
    why:why||`Next in the rotation — last was ${last.workout_code}`};
}

/* rest timer, with a notification if the phone allows one */
function notifyRest(){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  try{
    if(window.Notification && Notification.permission==='granted')
      new Notification('Rest is up', {body:'Next set.', tag:'cau-rest'});
  }catch(e){}
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const a=new C(), o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(.001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.7);
    o.start(); o.stop(a.currentTime+.75);
  }catch(e){}
}
function startTimer(sec){
  stopTimer(); timer={left:sec};
  if(D.settings.notify&&window.Notification&&Notification.permission==='default')
    try{ Notification.requestPermission(); }catch(e){}
  timer.id=setInterval(()=>{ timer.left--;
    if(timer.left<=0){ stopTimer(); notifyRest(); toast('Rest is up — next set.'); render(); return; }
    const el=document.getElementById('tval'); if(el) el.textContent=mmss(timer.left);
  },1000);
}
function stopTimer(){ if(timer){ clearInterval(timer.id); timer=null; } }
const timerHTML=()=>timer?`<div class="timer"><span class="small">Resting</span>

}

/* every routine, however it was created, gets the same normalising pass */
function normalise(r){
  r.cycle=r.cycle||1;
  (r.schedule||[]).forEach(d=>{ d.week=d.week||1; });
  r.exercises.forEach(e=>{
    const lib=SEED.library.find(x=>x.name===e.name)||{};
    if(e.pattern===undefined||e.pattern==='') e.pattern=lib.pattern||'';
    if(e.group===undefined) e.group=null;
    if(e.prog===undefined) e.prog='auto';
    if(e.stackStep===undefined)                       // machines get a pin number
      e.stackStep=(lib.equipment==='machine'||lib.equipment==='cable')?(U()==='kg'?5:10):null;
    if(e.prog==='stage'&&!e.stages) e.stages=[{sets:e.sets,reps:e.rep_scheme}];
    if(e.target===undefined) e.target=null;
  });
  /* GZCLP's heavy lifts really do change shape on a miss */
  if(/GZCLP/i.test(r.name)) r.exercises.forEach(e=>{
    if(String(e.rep_scheme).startsWith('3')&&e.sets>=5&&e.prog==='auto'){
      e.prog='stage'; e.stage=0;
      e.stages=[{sets:5,reps:'3+'},{sets:6,reps:'2+'},{sets:10,reps:'1+'}];
    }
  });
  return r;
}

    created:today(),timing:tpl.timing||{warmup:9,stretch:10,cardio:0},cycle:tpl.cycle||1,progVersion:2,
    workouts:(tpl.workouts||[]).map((w,i)=>({code:w.code,name:w.name,kind:w.kind||'main',
      follows:w.follows||null,colour:w.colour||PALETTE[i%PALETTE.length],position:w.position||i+1})),
    exercises:(tpl.exercises||[]).map((e,i)=>({id:id+1+i,workout_code:e.workout_code,name:e.name,
      sets:e.sets,rep_scheme:e.rep_scheme,rest_seconds:e.rest_seconds,body_area:e.body_area,
      tracks_weight:e.tracks_weight,current_weight:e.current_weight??null,
      fixed_increment:e.fixed_increment??null,is_optional:e.is_optional||0,is_rotation:e.is_rotation||0,
      is_barbell:e.is_barbell||0,is_core:e.is_core??((e.rest_seconds>=120)?1:0),
      pattern:e.pattern||(SEED.library.find(x=>x.name===e.name)||{}).pattern||'',
      cue:e.cue||'',sessions:0,sessions_at_weight:0,position:e.position})),
    rules:(tpl.rules||[]).map(x=>({...x})),
    schedule:(tpl.schedule||[]).map(x=>({...x}))};
  if(r.schedule.length&&r.schedule[0].code===undefined){

function matchTemplates(a){
  return SEED.templates.map(t=>{ let s=0;
    if(a.level&&t.level===a.level) s+=3;
    if(a.kit&&t.equipment===a.kit) s+=3;
    if(t.equipment==='any') s+=1;
    if(a.days) s+=Math.max(0,3-Math.abs((t.days_wk||3)-a.days));
    return {t,s}; }).sort((x,y)=>y.s-x.s).map(x=>x.t);
}

function sessionRow(s,editable){
  const rr=D.routines.find(x=>x.id===s.routineId);
  const ww=rr?.workouts.find(x=>x.code===s.workout_code);
  const det=(s.sets||[]).map(x=>{
    const nm=x.name||rr?.exercises.find(y=>y.id===x.exId)?.name||'—';
    return `${nm} — ${x.setsDone??x.sets??'?'} sets, ${x.reps} reps${x.weight!=null?` at ${fmt(x.weight)} ${U()}`:''}${x.pb?' · best yet':''}`;
  }).join('<br>');
  const ex=(s.extras||[]).map(x=>`${esc(x.name)} — ${esc(x.detail||'')}`).join('<br>');
  return `<button class="hist" ${editable?`data-editsess="${s.id}"`:''}>
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
      <div><span class="tag" style="background:${ww?.colour||'#666'}">${esc(s.workout_code)}</span>
        <b> ${esc(ww?.name||'')}</b>
        <div class="tiny muted">${esc(s.performed_on)}${s.minutes?` · ${s.minutes} min`:''}${s.kcal?` · about ${s.kcal} kcal`:''}</div></div>
      ${editable?'<span class="tiny muted">edit ›</span>':''}</div>
    ${det?`<div class="tiny muted" style="margin-top:6px">${det}</div>`:''}
    ${ex?`<div class="tiny muted" style="margin-top:4px">Also did: ${ex}</div>`:''}
    ${s.notes?`<div class="tiny muted" style="margin-top:4px">“${esc(s.notes)}”</div>`:''}</button>`;
}

/* exercises flagged to rotate (grip work, core work) — you do one, not all of them */
function rotationGroups(code,r){
  const groups={};
  exOf(code,r).forEach(e=>{ if(e.is_rotation){ const k=e.body_area||'other';
    (groups[k]=groups[k]||[]).push(e); } });
  Object.keys(groups).forEach(k=>{ if(groups[k].length<2) delete groups[k]; });
  return groups;
}
const ROT_LABEL={grip:'Grip work',core:'Core work',upper:'Upper accessory',lower:'Lower accessory',other:'Pick one'};
function leastRecent(list){
  const last={};
  L.sessions.forEach(s=>(s.sets||[]).forEach(x=>{ if(last[x.exId]===undefined) last[x.exId]=s.performed_on; }));
  return [...list].sort((a,b)=>((last[a.id]||'')>(last[b.id]||''))?1:-1)[0];
}

/* same muscle, same movement — whatever machine is free */
function variantsFor(e){
  const lib=SEED.library.find(x=>x.name===e.name);
  const pat=e.pattern||lib?.pattern, m=lib?lib.muscles[0]:null;
  return SEED.library.filter(x=>x.name!==e.name&&(x.pattern===pat||(m&&x.muscles[0]===m)))
    .slice(0,8);
}

/* ---------- session walkthrough ---------- */
function buildFlow(code){
  const list=exOf(code), stops=[], seen=new Set();
  list.forEach(e=>{
    if(seen.has(e.id)) return;
    if(e.group){
      const mates=list.filter(x=>x.group===e.group);
      mates.forEach(m=>seen.add(m.id));
      stops.push(mates.map(m=>m.id));
    } else { seen.add(e.id); stops.push([e.id]); }
  });
  return {code,i:0,order:stops,started:Date.now(),extras:[]};
}
const flowExercises=()=>flow.order.flat().map(id=>ex1(id)).filter(Boolean);
const flowSteps=()=>2+flow.order.length+1;
function railHTML(){
  let h=`<nav class="rail" aria-label="jump to exercise">
    <button data-jumpto="-1" ${flow.i===0?'aria-current="true"':''} title="Warm-up">W</button>`;
  flow.order.forEach((stop,i)=>{
    const done=stop.every(id=>entries[id]!==undefined&&entries[id]!=='');
    h+=`<button data-jumpto="${i}" class="${done?'done':''}" ${flow.i===i+1?'aria-current="true"':''}>${i+1}</button>`;
  });
  h+=`<button data-jumpto="${flow.order.length}" ${flow.i===flow.order.length+1?'aria-current="true"':''} title="Stretches">S</button>
    <button data-jumpto="${flow.order.length+1}" ${flow.i>=flowSteps()-1?'aria-current="true"':''} title="Finish">✓</button></nav>`;
  return h;
}
function viewFlow(){
  const w=wk(flow.code);
  let h=timerHTML();
  let body='';
  if(flow.i===0){
    const ck=clockFor(flow.code);
    body+=`<h2>Warm up first</h2><div class="card">
      <p class="small muted">About ${ck?ck.warmup:9} minutes.${ck?` The whole session should take around ${ck.total} minutes.`:''}</p>`;
    D.mobility.filter(m=>m.phase==='pre').forEach((m,i)=>
      body+=`<button class="check ${checks['pre'+i]?'done':''}" data-check="pre${i}">
        <span class="box">✓</span><span class="t">${esc(m.name)}</span><span class="r">${esc(m.prescription)}</span></button>`);
    body+=`</div>`;
  } else if(flow.i<=flow.order.length){
    const stop=flow.order[flow.i-1].map(id=>ex1(id)).filter(Boolean);
    if(!stop.length){ flow.order.splice(flow.i-1,1); return viewFlow(); }
    const isSuper=stop.length>1;
    body+=`<div class="hero" style="--c:${w.colour}">
      <div class="day">Stop ${flow.i} of ${flow.order.length}${isSuper?' · superset':''}</div>
      <div class="big">${stop.map(e=>esc(e.name)).join(' + ')}</div>
      ${isSuper?`<div class="why">Do a set of each back to back, then rest once.</div>`:''}</div>`;
    stop.forEach(e=>{
      const val=entries[e.id], reps=(val===''||val===undefined)?null:Number(val);
      const effort=entries['eff'+e.id];
      const nx=nextWeight(e,reps,effort);
      const pl=e.is_barbell?plates(e.current_weight,D.settings.barWeight):null;
      const pin=pinFor(e);
      const amrap=String(e.rep_scheme).includes('+');
      const mode=D.settings.logMode||'last';
      body+=`<div class="card"><h3>${esc(e.name)}</h3>
        <div class="small muted">${e.sets} set${e.sets===1?'':'s'} of ${esc(String(e.rep_scheme).replace('+',''))}${
          amrap?' — last set as many as you can do cleanly, one or two left in you':''}</div>
        ${e.tracks_weight?`<div class="field" style="margin:10px 0 0"><label>Weight</label>${stepper('w',e.id,e.current_weight,U())}</div>`
          :`<div class="small muted" style="margin-top:8px">Bodyweight — nothing to load.</div>`}
        ${pin?`<div class="tiny muted" style="margin-top:6px">That's pin ${pin.n} on the stack (${fmt(pin.kg)} ${U()})</div>`:''}
        ${pl?`<div class="tiny muted" style="margin-top:6px">Each side: ${pl.map(p=>fmt(p)).join(' + ')} (${fmt(D.settings.barWeight)} ${U()} bar)</div>`:''}
        ${diagram(e.name,e.pattern)}
        <p class="small muted" style="margin:8px 0 0">${esc(e.cue||'No notes for this one yet — add them under Plan.')}</p>`;
      const wu=warmupSets(e);
      if(wu.length&&isCoreLift(e)) body+=`<div class="tiny muted" style="margin-top:10px">Warm-up sets first:
        ${wu.map(s=>`${fmt(s.w)} ${U()} × ${s.r}`).join(', ')}</div>`;
      const allTicked=Array.from({length:e.sets},(_,i)=>checks[`s${e.id}_${i+1}`]).every(Boolean);
      body+=`<div style="display:flex;justify-content:flex-end;margin-top:10px">
        <button class="mini ${allTicked?'':'go'}" data-allsets="${e.id}">${
          allTicked?'Clear the ticks':`All ${e.sets} sets done`}</button></div>`;
      body+=`<div class="setgrid">`;
      for(let i=1;i<=e.sets;i++){ const k=`s${e.id}_${i}`;
        body+=`<button class="setbtn ${checks[k]?'done':''}" data-set="${k}" data-rest="${isSuper?Math.round(e.rest_seconds*0.7):e.rest_seconds}">Set ${i}<b>${checks[k]?'done':'—'}</b></button>`; }
      body+=`</div>`;
      if(mode==='each'){
        body+=`<div class="pair" style="margin-top:12px">`;
        for(let i=1;i<=e.sets;i++)
          body+=`<div class="field"><label>Set ${i} reps</label>
            <input type="number" inputmode="numeric" min="0" data-psreps="${e.id}_${i}" value="${entries['ps'+e.id+'_'+i]??''}"></div>`;
        body+=`</div>`;
      } else {
        body+=`<div class="field" style="margin-top:12px"><label>${mode==='same'
          ? 'Reps — the same on every set' : 'Reps on your last set'}</label>
          ${stepper('r',e.id,val===''||val===undefined?null:Number(val),'reps')}</div>`;
      }
      if(D.settings.effort) body+=`<div class="chips" style="margin-top:4px">
        ${['easy','right','hard'].map(x=>`<button data-eff="${e.id}:${x}" aria-pressed="${effort===x}">${
          x==='easy'?'Easy':x==='right'?'About right':'Hard'}</button>`).join('')}</div>`;
      const pbNow=pbCheck(e,reps);
      body+=`${pbNow?`<div class="card" style="background:var(--accent);color:var(--on-accent);
        border:none;margin:12px 0 0"><b>${pbNow.first?'First one on the board':'New best'}</b>
        <div class="small" style="opacity:.92">${fmt(e.current_weight)} ${U()} × ${reps} is about
        ${fmt(pbNow.now)} ${U()} for a single${pbNow.first?'':` — past your old best of ${fmt(pbNow.was)} ${U()}`}.</div></div>`:''}
      ${e.tracks_weight&&e.current_weight!==null?`<span class="next">next time <b>${fmt(nx)}</b> ${U()}</span>`:''}
        ${e.tracks_weight&&targetReps(e)!==null?`<p class="tiny muted" style="margin:10px 0 0">${
          progMode(e)==='stage'
            ? `Miss ${targetReps(e)} and the set shape changes rather than the weight.`
            : progMode(e)==='hold' ? `Progression is paused for this one.`
            : isCoreLift(e)
              ? `Hit ${targetReps(e)} reps and the weight goes up next time.`
              : `Stay here and build to ${repCeiling(e)} reps, then the weight goes up.`}</p>`:''}
        ${(e.sessions_at_weight||0)>=3?`<div class="tiny" style="margin-top:10px;color:#B7242B">
          Stuck ${e.sessions_at_weight} sessions with no extra reps.
          <button class="mini danger" data-deload="${e.id}">Drop 10% and build back</button></div>`:''}
      </div>`;
    });
    body+=`<div class="row-btns"><button class="mini" id="park">Machine's busy — do this later</button>
      <button class="mini" id="logmode">${{last:'Logging the last set',same:'Same reps every set',
        each:'Logging every set'}[D.settings.logMode||'last']}</button></div>`;
  } else if(flow.i===flow.order.length+1){
    const ck=clockFor(flow.code);
    body+=`<h2>Stretch it out</h2><p class="small muted">About ${ck?ck.stretch:10} minutes.</p><div class="card">`;
    D.mobility.filter(m=>m.phase==='post').forEach((m,i)=>
      body+=`<button class="check ${checks['post'+i]?'done':''}" data-check="post${i}">
        <span class="box">✓</span><span class="t">${esc(m.name)}</span><span class="r">${esc(m.prescription)}</span></button>`);
    body+=`</div>`;
  } else {
    const mins=Math.max(1,Math.round((Date.now()-flow.started)/60000));
    const kc=kcalFor(flow.code,mins);
    const rows=flowExercises().map(e=>{
      const per=perSetReps(e), v=per?per.filter(x=>x!==null).slice(-1)[0]:entries[e.id];
      const done=Array.from({length:e.sets},(_,i)=>checks[`s${e.id}_${i+1}`]).filter(Boolean).length;
      if(v===''||v===undefined) return `<li>${esc(e.name)}<span class="r">skipped</span></li>`;
      return `<li>${esc(e.name)}<span class="r">${done} of ${e.sets} sets · ${
        per?per.filter(x=>x!==null).join(', ')+' reps':v+' reps'}${
        e.current_weight!==null?` · next ${fmt(nextWeight(e,Number(v),entries['eff'+e.id]))} ${U()}`:''}</span></li>`; }).join('');
    body+=`<h2>All done</h2><div class="card"><ul class="plain">${rows}</ul></div>
      <div class="card"><h3>This session</h3><ul class="plain">
        <li>Time<span class="r">${mins} minutes</span></li>
        ${kc?`<li>Rough energy used<span class="r">${kc.kcal} kcal</span></li>`:''}
        <li>Sets finished<span class="r">${flowExercises().reduce((a,e)=>
          a+Array.from({length:e.sets},(_,i)=>checks[`s${e.id}_${i+1}`]).filter(Boolean).length,0)}</span></li>
        ${easyMode()?`<li>Easy week<span class="r">weights held</span></li>`:''}
      </ul>${kc?`<p class="tiny muted" style="margin:8px 0 0">Energy is a rough estimate from your bodyweight
        and how hard the session was, using standard MET values. Treat it as a ballpark, not a measurement.</p>`
        :`<p class="tiny muted" style="margin:8px 0 0">Record your bodyweight under Settings and I can estimate
        the energy used.</p>`}</div>
      ${(flow.extras||[]).length?`<div class="card"><h3>Also did</h3><ul class="plain">${
        flow.extras.map((x,i)=>`<li>${esc(x.name)}<span class="r">${esc(x.detail)} <button class="mini danger" data-rmextra="${i}">remove</button></span></li>`).join('')}</ul></div>`:''}
      <div class="row-btns"><button class="mini" id="addextra">Add something else you did</button></div>
      <div class="field" style="margin-top:12px"><label>Anything worth noting?</label>
        <input type="text" id="snote" placeholder="felt strong, left knee a bit tight…"></div>
      <button class="cta" id="finish">Save this session</button>
      <button class="cta ghost" id="abandon">Throw it away</button>`;
  }
  const bar = flow.i<flowSteps()-1
    ? `<div class="flowbar"><button class="prev" id="fprev">${flow.i===0?'Quit':'Back'}</button>
       <button class="next" id="fnext">Next</button></div>` : '';
  return h+`<div class="withrail"><div class="railmain">${body}${bar}</div>${railHTML()}</div>`;
}

function viewTargets(){
  const r=R();
  let h=`<h2>Targets</h2><p class="small muted">What you're working towards on each lift. The app
    still adds weight session by session — this is the number at the end of it.</p>`;
  r.workouts.forEach(w=>{
    const list=exOf(w.code,r).filter(e=>e.tracks_weight);
    if(!list.length) return;
    h+=`<div class="card pick" style="--c:${w.colour}"><h3>${esc(w.name)}</h3>`;
    list.forEach(e=>{
      const cur=e.current_weight, tgt=e.target;
      const pct=(cur!=null&&tgt)?Math.min(100,Math.round(cur/tgt*100)):null;
      h+=`<div style="padding:10px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div class="nm" style="font-size:16px">${esc(e.name)}</div>
          <div class="num" style="font-size:18px">${cur!=null?fmt(cur):'—'}${tgt?` / ${fmt(tgt)}`:''} ${U()}</div>
        </div>
        ${pct!==null?`<div style="height:6px;background:var(--wash);border-radius:3px;margin-top:8px">
          <div style="height:6px;width:${pct}%;background:var(--accent);border-radius:3px"></div></div>
          <div class="tiny muted" style="margin-top:4px">${pct}% of the way${
            pct>=100?' — target reached':''}</div>`:''}
        <div class="row-btns"><button class="mini" data-settarget="${e.id}">${tgt?'Change target':'Set a target'}</button>
          ${tgt?`<button class="mini danger" data-cleartarget="${e.id}">Clear</button>`:''}</div></div>`;
    });
    h+=`</div>`;
  });
  return h+`<button class="cta ghost" id="backplan">Done</button>`;
}

/* ---------- ELO ---------- */

  const pct=Math.min(100,Math.round(E.elo/3000*100));
  let h=`<h2>Your score</h2>
    <div class="card pick" style="--c:var(--accent)">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div><div class="num" style="font-size:46px;line-height:1">${E.elo}</div>
          <div class="nm">${esc(E.rank.name)}</div></div>
        <div class="tiny muted" style="text-align:right;max-width:52%">${esc(E.rank.blurb)}</div></div>
      <div style="height:8px;background:var(--wash);border-radius:4px;margin-top:12px">
        <div style="height:8px;width:${pct}%;background:var(--accent);border-radius:4px"></div></div>
      ${E.next?`<div class="tiny muted" style="margin-top:6px">${E.next.min-E.elo} points to ${esc(E.next.name)}</div>`
        :`<div class="tiny muted" style="margin-top:6px">Top rank.</div>`}

    <div class="card"><h3>Where the points come from</h3><ul class="plain">`;

  if(E.strength){
    h+=`<div class="card"><h3>Your lifts against the standards</h3><ul class="plain">`;
    E.strength.rows.sort((a,b)=>b.pts-a.pts).forEach(r2=>
      h+=`<li><div>${esc(r2.label)}<div class="tiny muted">${esc(r2.name)} · best about ${fmt(r2.one)} ${U()} for one</div></div>
        <span class="r">${r2.ratio}× bodyweight<br><b>${esc(r2.tier)}</b></span></li>`);
    h+=`</ul><p class="tiny muted" style="margin:10px 0 0">Ratios are an estimated one-rep max divided by
      your bodyweight, compared with the ExRx performance tables, StrengthLevel's dataset and Symmetric
      Strength. They describe trained adults roughly 18–39 — outside that, read them loosely.</p></div>`;
  } else {
    h+=`<div class="card"><h3>Half the score is missing</h3>
      <p class="small muted">Strength is worth 1800 of the 3000 points and I can't work it out without
      your bodyweight and which standards to compare against.</p>
      <div class="field"><label>Bodyweight (${U()})</label>${stepper('bw','x',bodyKg(),U())}</div>
      <div class="field"><label>Compare my lifts against</label><select id="stdsel">
        <option value="">choose one</option>
        <option value="m" ${D.settings.standards==='m'?'selected':''}>men's standards</option>
        <option value="f" ${D.settings.standards==='f'?'selected':''}>women's standards</option>
        <option value="none" ${D.settings.standards==='none'?'selected':''}>don't compare me</option>
      </select></div><button class="mini go" id="savestd">Save</button></div>`;
  }
  h+=`<div class="card"><h3>How to move it</h3><ul class="plain">`;
  tips.forEach(t2=>h+=`<li><div>${esc(t2)}</div></li>`);
  h+=`</ul></div>
    <div class="card"><h3>The ranks</h3><ul class="plain">`;
  RANKS.forEach(r3=>h+=`<li><div>${esc(r3.name)}${r3.name===E.rank.name?' <span class="badge">you</span>':''}
    <div class="tiny muted">${esc(r3.blurb)}</div></div><span class="r">${r3.min}+</span></li>`);
  h+=`</ul></div><button class="cta ghost" id="backprog">Done</button>`;

}

      h+=`</div><div class="card">${chartSVG(history(statEx),U())}
        ${(()=>{ const hs=history(statEx);
          const best=hs.reduce((a,b)=>(e1rm(b.w,b.r)||0)>(a?e1rm(a.w,a.r):0)?b:a,null);
          return best?`<p class="tiny muted" style="margin:8px 0 0">Best set so far: ${fmt(best.w)} ${U()} × ${best.r}
            — about ${fmt(e1rm(best.w,best.r))} ${U()} for a single.</p>`:''; })()}</div>`;
    }
  }
  if(D.bodyweight.length>1) h+=`<h2>Bodyweight</h2><div class="card">${
    chartSVG(D.bodyweight.slice().reverse().map(b=>({d:b.on,w:b.kg})),U())}</div>`;

  h+=`<h2>Sessions</h2>
    <div class="row-btns" style="margin-bottom:8px"><button class="mini go" id="addpast">Add a past session</button></div>`;
  if(!L.sessions.length) h+=`<div class="empty">Nothing logged yet.</div>`;
  L.sessions.slice(0,40).forEach(s=>h+=sessionRow(s,true));
  return h;
}

/* ---------- plan ---------- */
function viewPlan(){
  if(addex) return viewPicker();
  if(editing) return viewEdit();
  const r=R();
  if(!r) return `<div class="card"><h3>No routine yet</h3>
    <button class="cta" id="newroutine">Set up a routine</button></div>`;
  let h=`<h2>${esc(r.name)}</h2>`;
  if(r.blurb) h+=`<div class="card"><p class="small muted" style="margin:0">${esc(r.blurb)}</p>
    ${r.source?`<p class="tiny muted" style="margin:8px 0 0">${esc(r.source)}</p>`:''}</div>`;
  r.workouts.forEach(w=>{
    const c=clockFor(w.code,r);
    h+=`<div class="card pick" style="--c:${w.colour}"><h3>${esc(w.name)}</h3>
      <div class="tiny muted" style="margin-bottom:8px">${c?`About ${c.total} min · `:''}done ${doneCount(w.code)}×</div>
      <ul class="plain">`;
    exOf(w.code,r).forEach(e=>h+=`<li><div>${esc(e.name)}${(e.sessions_at_weight||0)>=3
      ?`<div class="tiny" style="color:#B7242B">stuck ${e.sessions_at_weight} sessions</div>`:''}</div>
      <span class="r">${e.group?`<span class="tiny">superset ${esc(e.group)} · </span>`:''}${e.sets} × ${esc(e.rep_scheme)}${
      e.current_weight!==null?` · ${fmt(e.current_weight)} ${U()}`:''}</span></li>`);
    h+=`</ul></div>`;
  });
  const vol=routineVolume(r);
  const low=Object.keys(vol).filter(m=>vol[m]>0&&vol[m]<6).map(m=>MUSCLE_LABEL[m]);
  const thin=r.workouts.filter(w=>exOf(w.code,r).length<=2);
  if(low.length||thin.length){
    h+=`<div class="card"><h3>Worth knowing</h3>`;
    if(low.length) h+=`<p class="small muted">Across the ${(r.cycle||1)===2?'fortnight':'week'} your
      ${esc(low.join(', '))} get fewer than 6 sets. Research points at 10–20 for building muscle. Another day,
      another 15 minutes, or an extra exercise would close it.</p>`;
    if(thin.length) h+=`<p class="small muted">${esc(thin.map(w=>w.name).join(', '))}
      ${thin.length===1?'has':'have'} only a couple of exercises. If you can spare ten more minutes,
      add one — supersetting two accessories costs almost no extra time.</p>`;
    h+=`<button class="mini" id="editroutine">Add an exercise</button></div>`;
  }
  h+=`<button class="cta" id="editroutine">Edit this routine</button>
    <div class="row-btns"><button class="mini" id="targets">Targets</button>
      <button class="mini" id="schedule">Change the schedule</button>
      <button class="mini" id="switchroutine">Switch or add a routine</button></div>`;
  const wkNow=cycleWeek(r);
  h+=`<h2>Your ${r.cycle===2?'fortnight':'week'}</h2>${r.cycle===2
    ?`<p class="small muted">You're in week ${wkNow} right now.</p>`:''}<div class="card"><table class="week"><tbody>`;
  (r.schedule||[]).forEach(d=>{
    const ww=d.code?wk(d.code,r):null;
    h+=`<tr${r.cycle===2&&(d.week||1)===wkNow?' style="background:var(--wash)"':''}><td>${r.cycle===2?`Wk ${d.week||1} `:''}${esc(d.day)}</td>
      <td>${ww?`<span class="tag" style="background:${ww.colour}">${esc(ww.code)}</span> ${esc(ww.name)}`
        :'<span class="muted small">Rest</span>'}</td>
      <td class="tiny muted">${esc(d.cardio||'')}</td></tr>`;
  });
  h+=`</tbody></table>${r.notes?`<p class="small muted" style="margin:10px 0 0">${esc(r.notes)}</p>`:''}</div>`;
  const pg=programmeScore();
  if(pg.notes.length) h+=`<div class="card"><h3>Worth knowing about this routine</h3>
    <ul class="plain">${pg.notes.map(n=>`<li><div>${esc(n[0].toUpperCase()+n.slice(1))}.</div></li>`).join('')}</ul>
    <p class="tiny muted" style="margin:8px 0 0">Not faults — just what this plan does and doesn't cover.
    Another day, another 15 minutes, or pairing two exercises are the usual levers.</p></div>`;
  h+=`<h2>What the numbers mean</h2><div class="card">
    <h3>“3 × 5+”</h3><p class="small muted">Three sets. The first two are five reps. On the last set you keep
    going for as many as you can do cleanly, stopping with one or two good ones left in you.</p>
    <h3>Picking your first weight</h3><p class="small muted">Start with the empty bar or the lightest pin and do
    five reps. If it was easy, add a little and try again. Stop when the reps slow or your form wobbles.</p></div>`;
  return h;
}

/* ---------- render ---------- */
function render(){
  applyTheme();
  const v=document.getElementById('view');
  v.innerHTML = dlg ? dialogHTML()
    : editSess ? viewEditSession()
    : tab==='today'?viewToday()
    : tab==='progress'?viewProgress()
    : tab==='plan'?(targetsOpen?viewTargets():D.schedEdit?viewSchedule():viewPlan())
    : viewSettings();
  document.getElementById('nav').innerHTML=
    [['today','Today'],['progress','Progress'],['plan','Plan'],['settings','Settings']]
    .map(([k,l])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''}>${l}</button>`).join('');
  const ss=document.getElementById('storeState');
  ss.textContent=persistent?(R()?R().name:'Ready'):'Not saving — changes last until you close this';
  ss.className=persistent?'store':'store warn';
  if(dlg){ const i=document.getElementById('dv'); if(i&&dlg.kind!=='area'){ i.focus(); i.select?.(); } }
  const screen=[tab,dlg?'d':'',wiz?'w'+wiz.step:'',preview?'pv':'',eloOpen?'elo':'',targetsOpen?'tg':'',flow?'f'+flow.i:'',editSess||'',addex?'p':'',editing?'e':''].join('|');
  if(screen!==lastScreen){ lastScreen=screen; window.scrollTo(0,0); }
}
let saveFailed=false;
async function persist(){
  const ok1=await store.set(KEY_D,D), ok2=await store.set(KEY_L,L);
  saveFailed=!(ok1&&ok2);
  return;
}
async function _persistUnused(){ await store.set(KEY_D,D); await store.set(KEY_L,L); }

function perSetReps(e){
  const mode=D.settings.logMode||'last';
  const out=[];
  for(let i=1;i<=e.sets;i++){
    const v=entries['ps'+e.id+'_'+i];
    out.push(v===''||v===undefined?null:Number(v));
  }
  if(mode==='each'&&out.some(x=>x!==null)) return out;
  const one=entries[e.id];
  if(one===''||one===undefined) return null;
  if(mode==='same') return Array(e.sets).fill(Number(one));
  return null;                                     // 'last' keeps a single number
}
function commitSession(code,notes){
  const r=R(), changes=[], sets=[], stageNotes=[];
  (flow?flowExercises():exOf(code)).forEach(e=>{
    const per=perSetReps(e);
    let raw=entries[e.id];
    if(per&&per.some(x=>x!==null)) raw=per.filter(x=>x!==null).slice(-1)[0];
    if(raw===undefined||raw==='') return;
    const reps=Number(raw), from=e.current_weight;
    const effort=entries['eff'+e.id];
    const to=nextWeight(e,reps,effort);
    const done=Array.from({length:e.sets},(_,i)=>checks[`s${e.id}_${i+1}`]).filter(Boolean).length;
    const pb=pbCheck(e,reps);
    sets.push({exId:e.id,name:e.name,sets:e.sets,setsDone:done||e.sets,weight:from,reps,pb:pb?pb.now:null,
      repsPerSet:per||null,effort:effort||null});
    e.sessions=(e.sessions||0)+1;
    const note=advanceStage(e,reps); if(note) stageNotes.push(note);
    if(to!==from){ e.sessions_at_weight=0; e.last_reps=0; }
    else if(reps>(e.last_reps||0)){ e.sessions_at_weight=0; e.last_reps=reps; }   // gaining reps is progress
    else e.sessions_at_weight=(e.sessions_at_weight||0)+1;
    e.current_weight=to;
    changes.push({id:e.id,name:e.name,from,to,reps});
  });
  if(!changes.length&&!(flow?.extras||[]).length) return null;
  const mins=flow?Math.max(1,Math.round((Date.now()-flow.started)/60000)):null;
  const kc=mins?kcalFor(code,mins):null;
  L.sessions.unshift({id:Date.now(),routineId:r.id,workout_code:code,performed_on:today(),
    changes,sets,extras:flow?.extras||[],notes:notes||'',minutes:mins,kcal:kc?kc.kcal:null,
    easy:easyMode()||null,stageNotes});
  entries={}; checks={};
  return changes;
}
function collectEdits(){
  const r=D.routines.find(x=>x.id===(editing||D.settings.activeId)); if(!r) return;
  document.querySelectorAll('[data-f]').forEach(el=>{
    const e=r.exercises.find(x=>x.id===Number(el.dataset.id)); if(!e) return;
    const f=el.dataset.f,v=el.value;
    if(f==='sets'||f==='rest_seconds') e[f]=Number(v)||1;
    else if(f==='current_weight'){ e[f]=v===''?null:Number(v); e.tracks_weight=v===''?0:1; }
    else if(f==='stackStep') e[f]=v===''?null:Number(v);
    else if(f==='group') e[f]=(v||'').trim().toUpperCase().slice(0,1)||null;
    else e[f]=v;
  });
}
function newExercise(r,code,name,extra){
  const pos=Math.max(0,...exOf(code,r).map(e=>e.position))+1;
  r.exercises.push(Object.assign({id:Date.now()+Math.floor(Math.random()*9999),workout_code:code,name,
    sets:3,rep_scheme:'10',rest_seconds:90,body_area:'upper',tracks_weight:1,current_weight:null,
    fixed_increment:null,is_optional:0,is_rotation:0,is_barbell:0,is_core:0,pattern:'',cue:'',
    sessions:0,sessions_at_weight:0,position:pos},extra||{}));
}
function convertUnits(to){
  const f=to==='lb'?2.20462:1/2.20462, g=to==='lb'?2.5:1.25;
  const rnd=x=>x===null||x===undefined?x:Math.round(x*f/g)*g;
  D.routines.forEach(r=>{
    r.exercises.forEach(e=>{ e.current_weight=rnd(e.current_weight); e.fixed_increment=rnd(e.fixed_increment); });
    (r.rules||[]).forEach(x=>{ x.upper_add=rnd(x.upper_add); x.lower_add=rnd(x.lower_add); }); });
  D.bodyweight.forEach(b=>b.kg=Math.round(b.kg*f*10)/10);
  L.sessions.forEach(s=>{                       // history converts too, or the graphs mix units
    (s.sets||[]).forEach(x=>{ if(x.weight!=null) x.weight=rnd(x.weight); });
    (s.changes||[]).forEach(c=>{ if(c.from!=null) c.from=rnd(c.from); if(c.to!=null) c.to=rnd(c.to); });
  });
  D.settings.barWeight=to==='lb'?45:20; D.settings.units=to;
}

  if(t.dataset.cleartarget){ const e=ex1(Number(t.dataset.cleartarget)); e.target=null;
    await persist(); render(); return; }
  if(t.dataset.statex){ statEx=Number(t.dataset.statex); render(); return; }
  if(t.dataset.editsess){ editSess=Number(t.dataset.editsess); render(); return; }
  if(t.id==='backprog'){ editSess=null; eloOpen=false; render(); return; }
  if(t.dataset.rmset!==undefined){ const s=L.sessions.find(x=>x.id===editSess);
    s.sets.splice(Number(t.dataset.rmset),1); await persist(); render(); return; }
  if(t.id==='addsetrow'){ const s=L.sessions.find(x=>x.id===editSess);
    ask({title:'What did you do?',kind:'text',placeholder:'e.g. Leg press',
      done:async v=>{ if(v) s.sets.push({exId:null,name:v,sets:3,setsDone:3,reps:10,weight:null});
        await persist(); render(); }});
    return; }
  if(t.id==='savesess'){
    const s=L.sessions.find(x=>x.id===editSess);
    s.performed_on=document.getElementById('sdate').value||s.performed_on;
    s.notes=document.getElementById('snote2').value;
    document.querySelectorAll('[data-sf]').forEach(el=>{
      const [i,f]=el.dataset.sf.split(':');
      const row=s.sets[Number(i)]; if(!row) return;
      row[f]= el.value===''?null:Number(el.value);
    });
    L.sessions.sort((a,b)=>b.performed_on.localeCompare(a.performed_on));
    editSess=null; await persist(); toast('Session updated.'); render(); return; }
  if(t.id==='delsess'){
    ask({title:'Delete this session?',ok:'Delete',body:'It disappears from your history and your graphs.',
      done:async()=>{ L.sessions=L.sessions.filter(x=>x.id!==editSess); editSess=null;
        await persist(); render(); }});
    return; }
  if(t.id==='addpast'){
    const r=R(); if(!r) return;
    const html=r.workouts.map(w=>`<button class="opt" data-pastcode="${esc(w.code)}">
      <span class="t">${esc(w.name)}</span></button>`).join('');
    ask({title:'Which session did you do?',html,cancel:'Cancel'}); return; }
  if(t.dataset.pastcode){
    const code=t.dataset.pastcode, r=R(); dlg=null;
    const s={id:Date.now(),routineId:r.id,workout_code:code,performed_on:today(),changes:[],
      sets:exOf(code,r).map(e=>({exId:e.id,name:e.name,sets:e.sets,setsDone:e.sets,
        weight:e.current_weight,reps:Number(String(e.rep_scheme).replace(/\D/g,''))||10})),
      extras:[],notes:'',minutes:null,kcal:null};
    L.sessions.unshift(s); editSess=s.id; tab='progress';
    await persist(); toast('Set the date and the numbers, then save.'); render(); return; }

  /* plan + edit */
  if(t.id==='editroutine'){ editing=D.settings.activeId; picked=null; tab='plan'; render(); return; }
  if(t.id==='backplan'){ if(editing) collectEdits(); editing=null; D.schedEdit=false; addex=null; targetsOpen=false;
    await persist(); render(); return; }
  if(t.id==='schedule'){ D.schedEdit=true; render(); return; }
  if(t.id==='savecyc'){ const r=R(), c=Number(document.getElementById('cyc').value);
    const WEEKD=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    if(c!==r.cycle){
      if(c===2){ const wk1=r.schedule.map(d=>({...d,week:1}));
        r.schedule=wk1.concat(WEEKD.map(d=>{ const src=wk1.find(x=>x.day===d)||{};
          return {day:d,week:2,code:src.code||null,cardio:src.cardio||''}; })); }
      else r.schedule=r.schedule.filter(d=>(d.week||1)===1);
      r.cycle=c;
    }
    await persist(); toast(c===2?'Fortnightly schedule ready.':'Back to a weekly schedule.'); render(); return; }
  if(t.id==='savesched'){ const r=R();
    document.querySelectorAll('[data-day]').forEach(el=>{
      const d=r.schedule[Number(el.dataset.day)]; if(d) d.code=el.value||null; });
    D.schedEdit=false; await persist(); toast('Schedule saved.'); render(); return; }
  if(t.id==='switchroutine'){ tab='settings'; render(); return; }
  if(t.dataset.useroutine){ D.settings.activeId=Number(t.dataset.useroutine); picked=null; chosen=null; preview=null;
    await persist(); toast('Switched.'); render(); return; }
  if(t.dataset.delroutine){ const id=Number(t.dataset.delroutine);
    ask({title:'Delete this routine?',ok:'Delete',body:'Logged sessions stay in your history.',
      done:async()=>{ D.routines=D.routines.filter(x=>x.id!==id);
        if(D.settings.activeId===id) D.settings.activeId=D.routines[0]?.id||null;
        await persist(); render(); }});
    return; }
  if(t.id==='saveRName'){ const r=R2(); r.name=document.getElementById('rname').value;
    r.notes=document.getElementById('rnotes').value; await persist(); toast('Saved.'); render(); return; }
  if(t.dataset.pick){ collectEdits(); picked=t.dataset.pick; render(); return; }
  if(t.id==='addWorkout'){ collectEdits();
    ask({title:'New session',kind:'text',placeholder:'e.g. Legs',
      done:async v=>{ if(!v) return render();
        const r=R2(), codes=r.workouts.map(w=>w.code);
        let c=v.trim()[0].toUpperCase(), n=1; while(codes.includes(c)) c=v.trim()[0].toUpperCase()+(++n);
        r.workouts.push({code:c,name:v,kind:'main',follows:null,
          colour:PALETTE[r.workouts.length%PALETTE.length],position:r.workouts.length+1});
        picked=c; await persist(); render(); }});
    return; }
  if(t.id==='renameWorkout'){ collectEdits(); const w=wk(picked,R2());
    ask({title:'Session name',kind:'text',value:w.name,
      done:async v=>{ if(v) w.name=v; await persist(); render(); }}); return; }
  if(t.dataset.delw){ const code=t.dataset.delw, r=R2();
    ask({title:'Delete this session?',ok:'Delete',body:'Its exercises go with it.',
      done:async()=>{ r.workouts=r.workouts.filter(w=>w.code!==code);
        r.exercises=r.exercises.filter(e=>e.workout_code!==code);
        (r.schedule||[]).forEach(d=>{ if(d.code===code) d.code=null; });
        picked=r.workouts[0]?.code||null; await persist(); render(); }});
    return; }
  if(t.dataset.addex){ collectEdits(); addex={muscle:null,code:t.dataset.addex};
    if(!editing) editing=D.settings.activeId; tab='plan'; render(); return; }
  if(t.dataset.muscle){ addex.muscle=t.dataset.muscle; render(); return; }
  if(t.dataset.addlib){
    const lib=SEED.library.find(x=>x.slug===t.dataset.addlib), r=R2();
    newExercise(r,addex.code,lib.name,{body_area:lib.area==='core'?'core':lib.area,
      is_barbell:lib.is_barbell,pattern:lib.pattern,cue:lib.cue,
      tracks_weight:lib.equipment==='bodyweight'?0:1,
      is_core:lib.tier==='core'?1:0,rest_seconds:lib.tier==='core'?150:90,
      sets:lib.tier==='core'?3:3,rep_scheme:lib.tier==='core'?'8':'12'});
    normalise(r);
    const back=addex&&addex.fromToday;
    if(back){ addex=null; editing=null; tab='today'; preview=null; }
    await persist(); toast(`${lib.name} added${back?' to today':''}.`); render(); return; }
  if(t.id==='addcustom'){
    ask({title:'Add your own',kind:'text',placeholder:'e.g. Sled push',
      body:'Name it, then pick the movement so it gets a diagram and progresses sensibly.',
      done:async v=>{ if(!v) return render();
        const opts=[['squat','Squat or leg press'],['hinge','Hinge, deadlift or glute work'],
          ['hpush','Pressing away from the chest'],['vpush','Pressing overhead'],
          ['hpull','Rowing towards you'],['vpull','Pulling down or up to a bar'],
          ['arms','Arms'],['calves','Calves'],['core','Core']];
        const html=opts.map(([p,l])=>`<button class="opt" data-custompat="${esc(v)}|${p}">
          <span class="t">${esc(l)}</span>${diagram('',p)}</button>`).join('');
        ask({title:`What sort of movement is ${v}?`,html,cancel:'Skip, no diagram',
          onCancel:async()=>{ newExercise(R2(),addex.code,v); await persist(); render(); }});
      }});
    return; }
  if(t.dataset.custompat){
    const [name,pat]=t.dataset.custompat.split('|');
    const area=({squat:'lower',hinge:'lower',calves:'lower',core:'core'})[pat]||'upper';
    newExercise(R2(),addex.code,name,{pattern:pat,body_area:area});
    dlg=null; await persist(); toast(`${name} added.`); render(); return; }
  if(t.id==='addcustom_old'){
    ask({title:'Add your own',kind:'text',placeholder:'e.g. Sled push',
      done:async v=>{ if(v) newExercise(R2(),addex.code,v); await persist(); render(); }}); return; }
  if(t.id==='backedit'){ addex=null; render(); return; }
  if(t.dataset.del){ collectEdits(); const r=R2(), e=r.exercises.find(x=>x.id===Number(t.dataset.del));
    ask({title:`Remove ${e.name}?`,ok:'Remove',
      done:async()=>{ r.exercises=r.exercises.filter(x=>x.id!==e.id); await persist(); render(); }}); return; }
  if(t.dataset.pairnext){
    collectEdits(); const r=R2(), e=r.exercises.find(x=>x.id===Number(t.dataset.pairnext));
    if(e.group) r.exercises.filter(x=>x.group===e.group).forEach(x=>x.group=null);
    else{
      const sib=exOf(e.workout_code,r), i=sib.indexOf(e), nxt=sib[i+1];
      if(!nxt){ toast('Nothing after this one to pair with.'); return; }
      const gid='g'+Date.now(); e.group=gid; nxt.group=gid; toast(`Paired with ${nxt.name}.`);
    }
    await persist(); render(); return; }
  if(t.dataset.move){ collectEdits(); const r=R2(), e=r.exercises.find(x=>x.id===Number(t.dataset.move));
    const sib=exOf(e.workout_code,r), i=sib.indexOf(e), j=i+Number(t.dataset.dir);
    if(j<0||j>=sib.length) return;
    const tmp=e.position; e.position=sib[j].position; sib[j].position=tmp;
    await persist(); render(); return; }
  if(t.id==='saveEdit'){ collectEdits(); await persist(); toast('Saved.'); render(); return; }
  if(t.dataset.opt!==undefined){ collectEdits(); const e=R2().exercises.find(x=>x.id===Number(t.dataset.opt));
    e.is_optional=e.is_optional?0:1; await persist(); render(); return; }
  if(t.id==='saveRules'){ const r=R2();
    document.querySelectorAll('[data-r]').forEach(el=>{
      const rl=r.rules[Number(el.dataset.r)]; if(rl) rl[el.dataset.rf]=Number(el.value)||0; });
    r.rules.sort((a,b)=>a.min_reps-b.min_reps);
    r.rules.forEach((rl,i)=>{ rl.max_reps=r.rules[i+1]?r.rules[i+1].min_reps-1:99; });
    await persist(); toast('Rules saved.'); render(); return; }
  if(t.id==='quickadd'){ collectEdits(); const code=picked, r=R2();
    ask({title:`Paste a list into ${esc(wk(code,r)?.name||code)}`,kind:'area',ok:'Add them',
      body:'One per line: <b>name, sets, reps, weight</b>. Sets, reps and weight are optional.',
      placeholder:'Leg extension, 3, 12, 30\nSeated calf raise, 4, 15\nPlank, 3, 30s',
      done:async v=>{ let n=0;
        (v||'').split('\n').forEach(line=>{ const p=line.split(',').map(x=>x.trim());
          if(!p[0]) return;
          newExercise(r,code,p[0],{sets:Number(p[1])||3,rep_scheme:p[2]||'10',
            current_weight:p[3]?Number(p[3]):null,tracks_weight:p[3]?1:0}); n++; });
        await persist(); toast(`${n} added.`); render(); }});
    return; }
  if(t.id==='exportcsv'||t.id==='exportjson'){
    D.settings.exportedAt=L.sessions.length; await persist();
    let txt;
    if(t.id==='exportjson') txt=JSON.stringify({routines:D.routines,sessions:L.sessions,
      bodyweight:D.bodyweight,settings:D.settings},null,1);
    else{
      const rows=[['date','routine','session','exercise','weight_'+U(),'sets_done','sets_planned','reps','reps_per_set','effort','minutes','kcal','notes']];
      L.sessions.forEach(s=>{ const rr=D.routines.find(x=>x.id===s.routineId);
        (s.sets||[]).forEach(x=>rows.push([s.performed_on,rr?rr.name:'',s.workout_code,
          x.name||'',x.weight??'',x.setsDone??'',x.sets??'',x.reps??'',
          (x.repsPerSet||[]).join(' ')||'',x.effort||'',s.minutes??'',s.kcal??'',
          (s.notes||'').replace(/[,\n]/g,' ')]));
        (s.extras||[]).forEach(x=>rows.push([s.performed_on,rr?rr.name:'',s.workout_code,
          x.name+' (extra)','','','','',''  ,'',s.minutes??'',s.kcal??'','']));
      });
      txt=rows.map(r=>r.join(',')).join('\n');
    }
    try{ await navigator.clipboard.writeText(txt); toast('Copied to your clipboard.'); }
    catch(e){ ask({title:'Your data',kind:'area',value:txt,cancel:'Close',
      body:'Select it all and copy.'}); }
    return; }

  /* settings */
  if(t.dataset.accent){ D.settings.accent=t.dataset.accent; await persist(); render(); return; }
  if(t.dataset.theme){ D.settings.theme=t.dataset.theme; await persist(); render(); return; }
  if(t.id==='savesettings'){
    D.profile.name=document.getElementById('uname')?.value||D.profile.name;
    const g=document.getElementById('guide'); if(g) D.settings.guided=g.value==='1';
    const sd=document.getElementById('stdsel'); if(sd&&sd.value) D.settings.standards=sd.value;
    const av=document.getElementById('adv'); if(av) D.settings.advanced=av.value==='1';
    const lm=document.getElementById('logmodesel'); if(lm) D.settings.logMode=lm.value;
    const ef=document.getElementById('effortsel'); if(ef) D.settings.effort=ef.value==='1';
    const nt=document.getElementById('notify'); if(nt) D.settings.notify=nt.value==='1';
    if(D.settings.notify&&window.Notification&&Notification.permission==='default')
      try{ Notification.requestPermission(); }catch(e){}
    const bw=document.getElementById('barw'); if(bw) D.settings.barWeight=Number(bw.value)||20;
    const wm=document.getElementById('warmm');
    if(wm&&R()) R().timing={warmup:Number(wm.value)||0,
      stretch:Number(document.getElementById('strm').value)||0,
      cardio:Number(document.getElementById('cardm').value)||0};
    const un=document.getElementById('units');
    if(un&&un.value!==D.settings.units) convertUnits(un.value);
    await persist(); toast('Settings saved.'); render(); return; }
  if(t.id==='addfb'){ const v=document.getElementById('fbnew').value.trim();
    if(!v){ toast('Nothing to save yet.'); return; }
    D.feedback.unshift({on:today(),text:v}); await persist(); toast('Noted.'); render(); return; }
  if(t.dataset.rmfb!==undefined){ D.feedback.splice(Number(t.dataset.rmfb),1); await persist(); render(); return; }
  if(t.id==='copyfb'){
    const txt=D.feedback.map(f=>`${f.on} — ${f.text}`).join('\n');
    try{ await navigator.clipboard.writeText(txt); toast('Copied.'); }
    catch(e){ ask({title:'Your notes',kind:'area',value:txt,cancel:'Close'}); }
    return; }
});
document.addEventListener('input', ev=>{
  const el=ev.target;
  if(el.dataset.reps!==undefined) entries[el.dataset.reps]=el.value;
  if(el.dataset.psreps!==undefined) entries['ps'+el.dataset.psreps]=el.value;
});

/* ---------- boot ---------- */
(async function(){
  D=await store.get(KEY_D)||await store.get(OLD_D);
  L=await store.get(KEY_L)||await store.get(OLD_L);
  if(!D) D={profile:{name:''},settings:{},routines:[],cardio:SEED.cardio,mobility:SEED.mobility,
    bodyweight:[],feedback:[]};
  D.settings=Object.assign({units:'kg',theme:'auto',accent:'iron',guided:true,barWeight:20,
    advanced:false,notify:true,activeId:null,logMode:'last',effort:false,easyUntil:null,
    standards:null,levelUpDismissed:false,
    comebackSeen:false},D.settings||{});
  if(D.settings.easyUntil&&D.settings.easyUntil<today()) D.settings.easyUntil=null;
  D.cardio=D.cardio||SEED.cardio; D.mobility=D.mobility||SEED.mobility;
  D.bodyweight=D.bodyweight||[]; D.routines=D.routines||[]; D.feedback=D.feedback||[];
  D.schedEdit=false;
  if(!L) L={sessions:[]};
  const GENTLE=[{min_reps:0,max_reps:2,upper_add:1.25,lower_add:2.5,label:'You hit the target'},
    {min_reps:3,max_reps:5,upper_add:2.5,lower_add:5,label:'A few reps clear'},
    {min_reps:6,max_reps:99,upper_add:5,lower_add:10,label:'Well clear — bigger jump'}];
  const STDB=[{min_reps:0,max_reps:2,upper_add:2.5,lower_add:5,label:'You hit the target'},
    {min_reps:3,max_reps:5,upper_add:5,lower_add:10,label:'A few reps clear'},
    {min_reps:6,max_reps:99,upper_add:7.5,lower_add:15,label:'Well clear — bigger jump'}];
  if(daysSinceLast()!==null&&daysSinceLast()<14) D.settings.comebackSeen=false;
  D.routines.forEach(r=>{
    if(r.progVersion!==2){                       // bands used to key off the raw rep count
      const gentle=(r.rules||[]).some(x=>x.min_reps>=10);
      r.rules=JSON.parse(JSON.stringify(gentle?GENTLE:STDB));
      r.progVersion=2;
      r.exercises.forEach(e=>{ e.last_reps=0; e.sessions_at_weight=0; });
    }
    normalise(r);
  });
  if(!D.routines.length) wiz={step:0,a:{}};
  await persist();
  render();
})();
</script>
</body>
</html>
